# Pipeline unique : compilation LaTeX (incrémentale, avec cache) puis build
# Astro, puis publication sur la branche gh-pages (peaceiris/actions-gh-pages).
#
# La création de la branche gh-pages active GitHub Pages automatiquement
# (source : branche gh-pages). Si besoin, vérifier dans
# Settings → Pages que la source est bien « Deploy from a branch : gh-pages ».
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache des PDF déjà compilés : seuls les .tex modifiés sont recompilés
      # (scripts/build-latex.mjs compare les hash via public/pdfs/manifest.json).
      # Restauration seule : l'enregistrement se fait en fin de tâche (voir plus bas), y compris
      # quand le déploiement échoue ou est annulé par une fusion plus récente — sinon une
      # compilation interrompue repartait de zéro (tâche A10 de docs/REPARTITION.md).
      - name: Restaurer le cache des PDF
        id: pdfcache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/pdfs
            public/og
          key: latex-pdfs-${{ hashFiles('content/**/*.tex', 'content/**/meta.yaml', 'templates/**/*.tex', 'scripts/build-latex.mjs') }}
          restore-keys: |
            latex-pdfs-

      # TeX Live minimal via apt (~2 min, jeu de paquets validé pour ce dépôt).
      # Sauté si le cache des PDF correspond exactement aux sources .tex (cas d'une
      # simple actualité) : aucun PDF à recompiler.
      # texlive-latex-extra : mdframed, needspace (chapitres compilés depuis cours.tex).
      - name: Installer TeX Live
        if: steps.pdfcache.outputs.cache-hit != 'true'
        # Déjà vu deux fois (26 oct.) : apt reste figé plus de 30 min côté GitHub. Délai par tentative,
        # trois essais, et le déploiement échoue franchement au lieu de rester suspendu.
        timeout-minutes: 40
        run: |
          for i in 1 2 3; do
            if sudo timeout 300 apt-get update -q && sudo timeout 600 apt-get install -y -q --no-install-recommends \
              latexmk texlive-latex-recommended texlive-lang-french texlive-fonts-recommended lmodern \
              texlive-pictures texlive-latex-extra; then break; fi
            echo "Installation de TeX Live : tentative $i échouée"; sleep 15
          done
          command -v latexmk

      # Aperçus de partage (Open Graph) : pdftoppm (première page des PDF) et une police
      # pour les titres. Toujours installés, même quand le cache LaTeX est valide.
      - name: Outils des aperçus de partage
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils fonts-dejavu-core

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Alerte (sans bloquer le déploiement) si une dépendance de production
      # a une vulnérabilité connue.
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit signale des vulnérabilités"

      # Moteur de correction de la page Entraînement : même code Rust que l'application.
      - name: Moteur de correction (Rust → WebAssembly)
        working-directory: app/native
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown

      # Connexion et synchronisation du site (faux serveur) : un test qui échoue bloque la mise en ligne.
      - name: Tests du site
        run: npm test

      - name: Compiler les PDF (latexmk)
        if: steps.pdfcache.outputs.cache-hit != 'true'
        run: node scripts/build-latex.mjs

      # Domaine du site : www.comima.mg (DNS chez tranokala : A @ → GitHub,
      # CNAME www → raantss18.github.io). La variable de dépôt CUSTOM_DOMAIN,
      # si elle est définie, remplace cette valeur.
      - name: Générer les index JSON + build Astro
        env:
          SITE_URL: https://${{ vars.CUSTOM_DOMAIN || 'www.comima.mg' }}
          BASE_PATH: /
          # Copie les APK vérifiés de la dernière version dans le site (scripts/fetch-app-apk.mjs).
          FETCH_APK: '1'
          # Projet Supabase (comptes sur la page Entraînement) : URL et clé PUBLIQUE « anon »,
          # variables du dépôt (Settings → Secrets and variables → Actions → Variables).
          COMIMA_SUPABASE_URL: ${{ vars.COMIMA_SUPABASE_URL }}
          COMIMA_SUPABASE_KEY: ${{ vars.COMIMA_SUPABASE_KEY }}
        run: npm run build

      - name: Déployer sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          # Écrit dist/CNAME : sans lui, force_orphan effacerait le domaine à
          # chaque déploiement.
          cname: ${{ vars.CUSTOM_DOMAIN || 'www.comima.mg' }}

      # Le site doit servir la dernière version de l'application (les 3 APK + release.json).
      # Non bloquant (le déploiement est déjà fait) mais visible en rouge dans l'onglet Actions.
      - name: Vérifier que le site sert la dernière version de l'application
        run: node scripts/check-app-live.mjs
        env:
          SITE_URL: https://${{ vars.CUSTOM_DOMAIN || 'www.comima.mg' }}

      # Enregistrement du cache des PDF. Clé exacte (hash des sources) seulement si tout a réussi :
      # un cache incomplet sous cette clé ferait sauter la compilation au déploiement suivant.
      - name: Enregistrer le cache des PDF
        if: success() && steps.pdfcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            public/pdfs
            public/og
          key: latex-pdfs-${{ hashFiles('content/**/*.tex', 'content/**/meta.yaml', 'templates/**/*.tex', 'scripts/build-latex.mjs') }}

      # Échec ou annulation : on garde quand même les PDF déjà compilés sous une clé « partielle »,
      # reprise par restore-keys (préfixe latex-pdfs-) ; la compilation incrémentale ne refait que le reste.
      - name: Enregistrer le cache partiel des PDF
        if: failure() || cancelled()
        uses: actions/cache/save@v6
        with:
          path: |
            public/pdfs
            public/og
          key: latex-pdfs-partiel-${{ github.run_id }}-${{ github.run_attempt }}
