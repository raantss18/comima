# Pipeline unique : compilation LaTeX (incrémentale, avec cache) puis build
# Astro, puis publication sur la branche gh-pages (peaceiris/actions-gh-pages).
#
# La création de la branche gh-pages active GitHub Pages automatiquement
# (source : branche gh-pages). Si besoin, vérifier dans
# Settings → Pages que la source est bien « Deploy from a branch : gh-pages ».
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache des PDF déjà compilés : seuls les .tex modifiés sont recompilés
      # (scripts/build-latex.mjs compare les hash via public/pdfs/manifest.json).
      - name: Restaurer le cache des PDF
        id: pdfcache
        uses: actions/cache@v6
        with:
          path: |
            public/pdfs
            public/og
          key: latex-pdfs-${{ hashFiles('content/**/*.tex', 'content/**/meta.yaml', 'templates/**/*.tex', 'scripts/build-latex.mjs') }}
          restore-keys: |
            latex-pdfs-

      # TeX Live minimal via apt (~2 min, jeu de paquets validé pour ce dépôt).
      # Sauté si le cache des PDF correspond exactement aux sources .tex (cas d'une
      # simple actualité) : aucun PDF à recompiler.
      # texlive-latex-extra : mdframed, needspace (chapitres compilés depuis cours.tex).
      - name: Installer TeX Live
        if: steps.pdfcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            latexmk texlive-latex-recommended texlive-lang-french texlive-fonts-recommended lmodern \
            texlive-pictures texlive-latex-extra

      # Aperçus de partage (Open Graph) : pdftoppm (première page des PDF) et une police
      # pour les titres. Toujours installés, même quand le cache LaTeX est valide.
      - name: Outils des aperçus de partage
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils fonts-dejavu-core

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Alerte (sans bloquer le déploiement) si une dépendance de production
      # a une vulnérabilité connue.
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit signale des vulnérabilités"

      - name: Compiler les PDF (latexmk)
        if: steps.pdfcache.outputs.cache-hit != 'true'
        run: node scripts/build-latex.mjs

      # Domaine du site : www.comima.mg (DNS chez tranokala : A @ → GitHub,
      # CNAME www → raantss18.github.io). La variable de dépôt CUSTOM_DOMAIN,
      # si elle est définie, remplace cette valeur.
      - name: Générer les index JSON + build Astro
        env:
          SITE_URL: https://${{ vars.CUSTOM_DOMAIN || 'www.comima.mg' }}
          BASE_PATH: /
        run: npm run build

      - name: Déployer sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          # Écrit dist/CNAME : sans lui, force_orphan effacerait le domaine à
          # chaque déploiement.
          cname: ${{ vars.CUSTOM_DOMAIN || 'www.comima.mg' }}
