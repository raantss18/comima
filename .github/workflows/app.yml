name: Application

# Vérifie le cœur Rust (moteur de correction + réponses de la banque) et le code Flutter
# à chaque modification de l'application ou de la banque de questions.
on:
  push:
    branches: [main]
    paths: ['app/**', 'content/**', 'src/content/**', 'scripts/**', 'templates/**', 'supabase/**', 'src/scripts/web-*', 'src/scripts/fiche/**', 'src/scripts/cours/**', 'scripts/build-app-figures.mjs', 'scripts/app-figures.css', 'tests/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'content/**', 'src/content/**', 'scripts/**', 'templates/**', 'supabase/**', 'src/scripts/web-*', 'src/scripts/fiche/**', 'src/scripts/cours/**', 'scripts/build-app-figures.mjs', 'scripts/app-figures.css', 'tests/**', '.github/workflows/app.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cœur Rust (tests)
        working-directory: app/native
        run: cargo test --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      # Contenus réels (exercices, sujets, articles) tels que l'application les affiche : le test
      # « toute la bibliothèque » de app/test/math_text_test.dart les lit dans public/app/v1/library.json.
      # Une PR de contenu qui ferait apparaître du LaTeX, du HTML ou du Markdown brut dans l'application échoue ici.
      - name: Contenus de l'application (pour les tests d'affichage)
        run: |
          npm ci
          node scripts/build-index.mjs
          node scripts/build-app-packs.mjs

      - name: Flutter (analyse)
        working-directory: app
        run: |
          mkdir -p assets/content/packs assets/content/figures
          flutter pub get
          flutter analyze
          flutter test

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Schéma et règles d'accès (RLS)
        run: supabase/tests/run.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Tests du site (connexion, synchronisation, illustrations)
        run: npm test
