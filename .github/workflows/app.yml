name: Application

# Vérifie le cœur Rust (moteur de correction + réponses de la banque) et le code Flutter
# à chaque modification de l'application ou de la banque de questions.
on:
  push:
    branches: [main]
    paths: ['app/**', 'content/app/**', 'supabase/**', 'src/scripts/web-*', 'src/scripts/fiche/**', 'src/scripts/cours/**', 'scripts/build-app-figures.mjs', 'scripts/app-figures.css', 'tests/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'content/app/**', 'supabase/**', 'src/scripts/web-*', 'src/scripts/fiche/**', 'src/scripts/cours/**', 'scripts/build-app-figures.mjs', 'scripts/app-figures.css', 'tests/**', '.github/workflows/app.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cœur Rust (tests)
        working-directory: app/native
        run: cargo test --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Illustrations de l'application (pages HTML autonomes)
        run: |
          npm ci
          node scripts/build-app-figures.mjs app/assets/figures

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter (analyse)
        working-directory: app
        run: |
          mkdir -p assets/content/packs
          flutter pub get
          flutter analyze
          flutter test

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Schéma et règles d'accès (RLS)
        run: supabase/tests/run.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests du site (connexion, synchronisation)
        run: npm test
