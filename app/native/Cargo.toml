[package]
name = "comima_core"
version = "0.1.0"
edition = "2021"
description = "Moteur de correction et vérification des paquets de l'application COMIMa"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
serde_yaml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
