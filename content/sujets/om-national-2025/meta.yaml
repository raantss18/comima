  2025 national paper: three problems (a varied one: clocks, logic, volumes,
  meal prices, pie, de Gua's theorem; "balanced numbers"; a guided variant on
  balanced numbers with Python) with full solutions.
  PDF recompiled by COMIMa from the corrected sources (27 Oct 2026); LaTeX sources downloadable.
