id: contre-exemples
theme: arithmétique
niveau: 1
chapitre: 00-exemples-contre-exemples
titre:
  fr: Exemples et contre-exemples
  en: Examples and counterexamples
fiche:
  fr: |
    Un énoncé **universel** affirme qu'une propriété $P(n)$ est vraie pour **tout** $n$ d'un ensemble $E$.

    Un **contre-exemple** est un $n_0$ de $E$ pour lequel $P(n_0)$ est fausse.

    Si $E$ est infini, vérifier $P(n)$ sur **beaucoup d'exemples ne prouve pas** l'énoncé : il faut une démonstration valable pour tout $n$ de $E$.

    En revanche, **un seul contre-exemple suffit** pour montrer qu'un énoncé « pour tout $n$ » est faux.

    La négation de « pour tout $n$ de $E$, $P(n)$ » est « **il existe** $n$ de $E$ tel que **non** $P(n)$ ».

    Si $E$ est fini, tout vérifier cas par cas est une démonstration.

    Pour un énoncé **existentiel** (« il existe $n$ de $E$ tel que $P(n)$ »), un seul exemple suffit à le démontrer.
  en: |
    A **universal** statement claims that a property $P(n)$ holds for **every** $n$ in a set $E$.

    A **counterexample** is an $n_0$ in $E$ for which $P(n_0)$ is false.

    If $E$ is infinite, checking $P(n)$ on **many examples does not prove** the statement: a proof valid for every $n$ in $E$ is needed.

    On the other hand, **a single counterexample is enough** to show that a “for every $n$” statement is false.

    The negation of “for every $n$ in $E$, $P(n)$” is “**there exists** $n$ in $E$ such that **not** $P(n)$”.

    If $E$ is finite, checking every case one by one is a proof.

    For an **existential** statement (“there exists $n$ in $E$ such that $P(n)$”), a single example is enough to prove it.
questions:
  - id: ce-01
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Si une propriété $P(n)$ est vraie pour $n = 1, 2, \\dots, 1000$, alors elle est vraie pour tout entier $n \\ge 1$."
      en: "If a statement $P(n)$ holds for $n = 1, 2, \\dots, 1000$, then it holds for every integer $n \\ge 1$."
    reponse: false
    explication:
      fr: "Contre-exemple : « $n < 1001$ » est vraie pour $n = 1, \\dots, 1000$ et fausse pour $n = 1001$. Des exemples, même très nombreux, ne prouvent rien."
      en: "Counterexample: “$n < 1001$” holds for $n = 1, \\dots, 1000$ and fails for $n = 1001$. Examples, however many, prove nothing."

  - id: ce-02
    type: qcm
    difficulte: 1
    enonce:
      fr: "Quelle est la négation de « tout entier $n$ vérifie $P(n)$ » ?"
      en: "What is the negation of “every integer $n$ satisfies $P(n)$”?"
    choix:
      - { fr: "Il existe un entier $n$ qui ne vérifie pas $P(n)$.", en: "There is an integer $n$ that does not satisfy $P(n)$." }
      - { fr: "Aucun entier $n$ ne vérifie $P(n)$.", en: "No integer $n$ satisfies $P(n)$." }
      - { fr: "Tout entier $n$ vérifie « non $P(n)$ ».", en: "Every integer $n$ satisfies “not $P(n)$”." }
    bonnes: [0]
    explication:
      fr: "« Pour tout » devient « il existe », et la propriété est niée. Un seul $n$ suffit."
      en: "“For every” becomes “there exists”, and the property is negated. A single $n$ is enough."

  - id: ce-03
    type: numeric
    difficulte: 2
    enonce:
      fr: "Les premières valeurs du polynôme d'Euler $n^2 + n + 41$ (pour $n = 0, 1, 2, \\dots$) sont des nombres premiers. Quel est le plus petit entier $n \\ge 0$ pour lequel il ne donne **pas** un nombre premier ?"
      en: "The first values of Euler's polynomial $n^2 + n + 41$ (for $n = 0, 1, 2, \\dots$) are primes. What is the smallest integer $n \\ge 0$ for which it does **not** give a prime?"
    reponse: "40"
    indice:
      fr: "Cherche une valeur de $n$ qui fait apparaître $41$ en facteur."
      en: "Look for a value of $n$ that makes $41$ a factor."
    explication:
      fr: "Pour $n = 40$ : $40^2 + 40 + 41 = 40 \\cdot 41 + 41 = 41^2 = 1681$. Pour $n = 0, \\dots, 39$, on obtient bien des premiers (voir la simulation « Un polynôme qui ne donne que des premiers ? »)."
      en: "For $n = 40$: $40^2 + 40 + 41 = 40 \\cdot 41 + 41 = 41^2 = 1681$. For $n = 0, \\dots, 39$ the values are indeed prime (see the “A polynomial giving only primes?” simulation)."

  - id: ce-04
    type: numeric
    difficulte: 2
    enonce:
      fr: "On place $n$ points sur un cercle et on trace toutes les cordes (trois cordes ne se coupent jamais en un même point intérieur). Pour $n = 1, 2, 3, 4, 5$ on obtient $1, 2, 4, 8, 16$ régions. Combien de régions pour $n = 6$ ?"
      en: "Place $n$ points on a circle and draw every chord (no three chords meet at an interior point). For $n = 1, 2, 3, 4, 5$ we get $1, 2, 4, 8, 16$ regions. How many regions for $n = 6$?"
    reponse: "31"
    explication:
      fr: "On obtient $31$, et non $32$ : la conjecture « $2^{n-1}$ » est fausse. La formule exacte est $1 + \\binom{n}{2} + \\binom{n}{4}$, soit $1 + 15 + 15 = 31$."
      en: "We get $31$, not $32$: the “$2^{n-1}$” conjecture is false. The exact formula is $1 + \\binom{n}{2} + \\binom{n}{4}$, i.e. $1 + 15 + 15 = 31$."

  - id: ce-05
    type: ensemble
    difficulte: 2
    enonce:
      fr: "Pour quels entiers $n$ de $1$ à $10$ le nombre $2^n - 1$ est-il premier ?"
      en: "For which integers $n$ from $1$ to $10$ is $2^n - 1$ prime?"
    reponse: [2, 3, 5, 7]
    explication:
      fr: "$3, 7, 31, 127$ sont premiers ; $2^1 - 1 = 1$ ne l'est pas, et pour $n$ composé, $2^n - 1$ est composé ($2^{ab} - 1$ est divisible par $2^a - 1$) : $15, 63, 255, 511 = 7 \\times 73, 1023$."
      en: "$3, 7, 31, 127$ are prime; $2^1 - 1 = 1$ is not, and for composite $n$, $2^n - 1$ is composite ($2^{ab} - 1$ is divisible by $2^a - 1$): $15, 63, 255, 511 = 7 \\times 73, 1023$."

  - id: ce-06
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Si $p$ est un nombre premier, alors $2^p - 1$ est premier."
      en: "If $p$ is prime, then $2^p - 1$ is prime."
    reponse: false
    explication:
      fr: "Contre-exemple : $p = 11$ et $2^{11} - 1 = 2047 = 23 \\times 89$. (La réciproque, elle, est vraie : si $2^n - 1$ est premier, alors $n$ est premier.)"
      en: "Counterexample: $p = 11$ and $2^{11} - 1 = 2047 = 23 \\times 89$. (The converse is true: if $2^n - 1$ is prime, then $n$ is prime.)"

  - id: ce-07
    type: numeric
    difficulte: 3
    enonce:
      fr: "Fermat pensait que les nombres $F_n = 2^{2^n} + 1$ sont tous premiers. Euler a montré que $F_5 = 2^{32} + 1$ est divisible par un nombre premier inférieur à $1000$. Lequel ?"
      en: "Fermat believed that the numbers $F_n = 2^{2^n} + 1$ are all prime. Euler showed that $F_5 = 2^{32} + 1$ is divisible by a prime below $1000$. Which one?"
    reponse: "641"
    explication:
      fr: "$2^{32} + 1 = 641 \\times 6\\,700\\,417$. Un seul contre-exemple a suffi à réfuter la conjecture de Fermat."
      en: "$2^{32} + 1 = 641 \\times 6\\,700\\,417$. A single counterexample was enough to refute Fermat's conjecture."

  - id: ce-08
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour tout entier $n \\ge 0$, $n^2 > n$."
      en: "For every integer $n \\ge 0$, $n^2 > n$."
    reponse: false
    explication:
      fr: "Contre-exemple : $n = 1$ donne $1 > 1$, faux (et $n = 0$ aussi)."
      en: "Counterexample: $n = 1$ gives $1 > 1$, false (and so does $n = 0$)."

  - id: ce-09
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Si $n^2$ est divisible par $4$, alors $n$ est divisible par $4$."
      en: "If $n^2$ is divisible by $4$, then $n$ is divisible by $4$."
    reponse: false
    explication:
      fr: "Contre-exemple : $n = 2$, $n^2 = 4$ est divisible par $4$ mais pas $2$."
      en: "Counterexample: $n = 2$, $n^2 = 4$ is divisible by $4$ but $2$ is not."

  - id: ce-10
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Si $n^2$ est divisible par $6$, alors $n$ est divisible par $6$."
      en: "If $n^2$ is divisible by $6$, then $n$ is divisible by $6$."
    reponse: true
    explication:
      fr: "Il n'y a pas de contre-exemple, et cela se démontre : $2 \\mid n^2 \\Rightarrow 2 \\mid n$ et $3 \\mid n^2 \\Rightarrow 3 \\mid n$ (car $2$ et $3$ sont premiers), donc $6 \\mid n$. Pour $4$ ou $9$ l'énoncé échoue, car $4$ et $9$ ne sont pas « sans facteur carré »."
      en: "There is no counterexample, and it can be proved: $2 \\mid n^2 \\Rightarrow 2 \\mid n$ and $3 \\mid n^2 \\Rightarrow 3 \\mid n$ ($2$ and $3$ are prime), so $6 \\mid n$. For $4$ or $9$ it fails, since they are not square-free."

  - id: ce-11
    type: numeric
    difficulte: 2
    enonce:
      fr: "Le nombre $n^2 - n + 11$ est premier pour $n = 1, 2, 3, \\dots$ Quel est le plus petit $n \\ge 1$ pour lequel il n'est **pas** premier ?"
      en: "The number $n^2 - n + 11$ is prime for $n = 1, 2, 3, \\dots$ What is the smallest $n \\ge 1$ for which it is **not** prime?"
    reponse: "11"
    explication:
      fr: "$11^2 - 11 + 11 = 121 = 11^2$. Pour $n = 1, \\dots, 10$ on obtient bien des premiers."
      en: "$11^2 - 11 + 11 = 121 = 11^2$. For $n = 1, \\dots, 10$ the values are indeed prime."

  - id: ce-12
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit $n \\ge 1$ pour lequel $n^2 + n + 17$ n'est **pas** premier ?"
      en: "What is the smallest $n \\ge 1$ for which $n^2 + n + 17$ is **not** prime?"
    reponse: "16"
    explication:
      fr: "$16^2 + 16 + 17 = 289 = 17^2$. Pour $n = 1, \\dots, 15$, c'est premier."
      en: "$16^2 + 16 + 17 = 289 = 17^2$. For $n = 1, \\dots, 15$ it is prime."

  - id: ce-13
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "La somme de deux nombres irrationnels est toujours irrationnelle."
      en: "The sum of two irrational numbers is always irrational."
    reponse: false
    explication:
      fr: "Contre-exemple : $\\sqrt2 + (-\\sqrt2) = 0$, qui est rationnel."
      en: "Counterexample: $\\sqrt2 + (-\\sqrt2) = 0$, which is rational."

  - id: ce-14
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Le produit de deux nombres irrationnels est toujours irrationnel."
      en: "The product of two irrational numbers is always irrational."
    reponse: false
    explication:
      fr: "Contre-exemple : $\\sqrt2 \\times \\sqrt2 = 2$."
      en: "Counterexample: $\\sqrt2 \\times \\sqrt2 = 2$."

  - id: ce-15
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour tous réels $a$ et $b$, si $a^2 = b^2$ alors $a = b$."
      en: "For all real numbers $a$ and $b$, if $a^2 = b^2$ then $a = b$."
    reponse: false
    explication:
      fr: "Contre-exemple : $a = 1$ et $b = -1$. On a seulement $a = b$ ou $a = -b$."
      en: "Counterexample: $a = 1$ and $b = -1$. We only get $a = b$ or $a = -b$."

  - id: ce-16
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour tous réels $a$ et $b$, $|a + b| = |a| + |b|$."
      en: "For all real numbers $a$ and $b$, $|a + b| = |a| + |b|$."
    reponse: false
    explication:
      fr: "Contre-exemple : $a = 1$, $b = -1$ donne $0 \\ne 2$. On a seulement $|a + b| \\le |a| + |b|$."
      en: "Counterexample: $a = 1$, $b = -1$ gives $0 \\ne 2$. We only have $|a + b| \\le |a| + |b|$."

  - id: ce-17
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Tout nombre premier est impair."
      en: "Every prime number is odd."
    reponse: false
    explication:
      fr: "Contre-exemple : $2$ est premier et pair."
      en: "Counterexample: $2$ is prime and even."

  - id: ce-18
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour tous réels $a < b$, on a $a^2 < b^2$."
      en: "For all real numbers $a < b$, we have $a^2 < b^2$."
    reponse: false
    explication:
      fr: "Contre-exemple : $a = -3 < b = 2$, mais $9 > 4$."
      en: "Counterexample: $a = -3 < b = 2$, but $9 > 4$."

  - id: ce-19
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour tous réels $a, b > 0$, $(a + b)^2 = a^2 + b^2$."
      en: "For all real numbers $a, b > 0$, $(a + b)^2 = a^2 + b^2$."
    reponse: false
    explication:
      fr: "Contre-exemple : $a = b = 1$ donne $4 \\ne 2$. En fait $(a+b)^2 = a^2 + 2ab + b^2$."
      en: "Counterexample: $a = b = 1$ gives $4 \\ne 2$. In fact $(a+b)^2 = a^2 + 2ab + b^2$."

  - id: ce-20
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour tout réel $x$, $\\sqrt{x^2} = x$."
      en: "For every real number $x$, $\\sqrt{x^2} = x$."
    reponse: false
    explication:
      fr: "Contre-exemple : $x = -1$ donne $\\sqrt{1} = 1 \\ne -1$. En fait $\\sqrt{x^2} = |x|$."
      en: "Counterexample: $x = -1$ gives $\\sqrt{1} = 1 \\ne -1$. In fact $\\sqrt{x^2} = |x|$."

  - id: ce-21
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "La fonction $x \\mapsto x^2$ est croissante sur $\\mathbb R$."
      en: "The function $x \\mapsto x^2$ is increasing on $\\mathbb R$."
    reponse: false
    explication:
      fr: "Contre-exemple : $-2 < -1$ mais $4 > 1$. Elle est croissante sur $[0\\,;+\\infty[$ seulement."
      en: "Counterexample: $-2 < -1$ but $4 > 1$. It is increasing on $[0\\,;+\\infty[$ only."

  - id: ce-22
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Une propriété vérifiée pour tous les entiers $n \\le 10^9$ est démontrée pour tout entier $n$."
      en: "A statement checked for every integer $n \\le 10^9$ is proved for all integers $n$."
    reponse: false
    explication:
      fr: "Une vérification, même gigantesque, ne remplace pas une démonstration : le premier contre-exemple peut être au-delà de la limite testée."
      en: "A check, however huge, is not a proof: the first counterexample may lie beyond the tested range."

  - id: ce-23
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit entier $n \\ge 2$ pour lequel $2^n - 1$ n'est **pas** premier ?"
      en: "What is the smallest integer $n \\ge 2$ for which $2^n - 1$ is **not** prime?"
    reponse: "4"
    explication:
      fr: "$2^2 - 1 = 3$ et $2^3 - 1 = 7$ sont premiers, mais $2^4 - 1 = 15 = 3\\times5$."
      en: "$2^2 - 1 = 3$ and $2^3 - 1 = 7$ are prime, but $2^4 - 1 = 15 = 3\\times5$."

  - id: ce-24
    type: numeric
    difficulte: 3
    enonce:
      fr: "Quel est le plus petit entier strictement positif qui s'écrit de **deux** façons différentes comme somme de deux cubes d'entiers strictement positifs ?"
      en: "What is the smallest positive integer that can be written in **two** different ways as a sum of two positive cubes?"
    reponse: "1729"
    explication:
      fr: "$1729 = 1^3 + 12^3 = 9^3 + 10^3$ (le nombre de Hardy-Ramanujan). Aucun entier plus petit ne le fait."
      en: "$1729 = 1^3 + 12^3 = 9^3 + 10^3$ (the Hardy–Ramanujan number). No smaller integer does."

  - id: ce-25
    type: numeric
    difficulte: 2
    enonce:
      fr: "Parmi les entiers de $1$ à $20$, combien ne sont **pas** la somme de deux carrés d'entiers (le carré $0$ est autorisé) ?"
      en: "Among the integers from $1$ to $20$, how many are **not** the sum of two squares of integers ($0$ is allowed as a square)?"
    reponse: "8"
    explication:
      fr: "Sont des sommes de deux carrés : $1, 2, 4, 5, 8, 9, 10, 13, 16, 17, 18, 20$ (12 nombres). Les $8$ autres sont $3, 6, 7, 11, 12, 14, 15, 19$."
      en: "Sums of two squares: $1, 2, 4, 5, 8, 9, 10, 13, 16, 17, 18, 20$ (12 numbers). The other $8$ are $3, 6, 7, 11, 12, 14, 15, 19$."

  - id: ce-26
    type: numeric
    difficulte: 3
    enonce:
      fr: "Si $p$ est premier impair, alors $2^{p-1} \\equiv 1 \\pmod p$ (petit théorème de Fermat). La réciproque est fausse : quel est le plus petit entier impair **composé** $n$ tel que $2^{n-1} \\equiv 1 \\pmod n$ ?"
      en: "If $p$ is an odd prime, then $2^{p-1} \\equiv 1 \\pmod p$ (Fermat's little theorem). The converse is false: what is the smallest odd **composite** $n$ with $2^{n-1} \\equiv 1 \\pmod n$?"
    reponse: "341"
    explication:
      fr: "$n = 341 = 11\\times31$ : $2^{10} = 1024 = 3\\times341 + 1 \\equiv 1 \\pmod{341}$, donc $2^{340} \\equiv 1$. Un seul contre-exemple suffit à réfuter la réciproque."
      en: "$n = 341 = 11\\times31$: $2^{10} = 1024 = 3\\times341 + 1 \\equiv 1 \\pmod{341}$, so $2^{340} \\equiv 1$. A single counterexample refutes the converse."

  - id: ce-27
    type: qcm
    difficulte: 2
    enonce:
      fr: "Pour réfuter un énoncé de la forme « il **existe** $n$ tel que $P(n)$ », que faut-il faire ?"
      en: "To refute a statement of the form “there **exists** $n$ such that $P(n)$”, what must you do?"
    choix:
      - { fr: "Trouver un seul $n$ tel que $P(n)$ est faux", en: "Find a single $n$ with $P(n)$ false" }
      - { fr: "Montrer que $P(n)$ est faux pour tout $n$", en: "Show that $P(n)$ is false for every $n$" }
      - { fr: "Trouver un seul $n$ tel que $P(n)$ est vrai", en: "Find a single $n$ with $P(n)$ true" }
    bonnes: [1]
    explication:
      fr: "Un énoncé existentiel est faux si **aucun** $n$ ne convient : il faut montrer « non $P(n)$ » pour tout $n$. Un seul exemple, lui, le démontre au lieu de le réfuter."
      en: "An existential statement is false when **no** $n$ works: you must show “not $P(n)$” for every $n$. A single example proves it rather than refutes it."
