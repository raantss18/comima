id: strategies-conjugues
theme: arithmétique
niveau: 4
titre:
  fr: Conjugués, rationalisation et parties entières
  en: Conjugates, rationalization and floors
fiche:
  fr: 'Le conjugué de $u+v\sqrt d$ est $u-v\sqrt d$. Leur produit est $u^2-dv^2$ ; c’est une quantité
    entière quand $u,v,d$ sont entiers. Dans une puissance, la conjugaison change le signe des coefficients
    de $\sqrt d$ et conserve les coefficients rationnels.


    Rationaliser $\sqrt{n^2+1}-n$ en multipliant par son conjugué donne $1/(\sqrt{n^2+1}+n)$, ce qui évite
    la soustraction de deux grands nombres proches.


    La partie entière $\lfloor x\rfloor$ est le plus grand entier inférieur ou égal à $x$. Si $A$ est
    entier et $0<t<1$, alors $\lfloor A-t\rfloor=A-1$.


    Compter les couples $(d,k)$ avec $dk\le N$ donne $\sum_{n=1}^N\tau(n)=\sum_{d=1}^N\lfloor N/d\rfloor$,
    où $\tau$ compte les diviseurs positifs. En pondérant chaque couple par $d$, on obtient la formule
    analogue pour la somme des diviseurs.'
  en: 'The conjugate of $u+v\sqrt d$ is $u-v\sqrt d$. Their product is $u^2-dv^2$, an integer for integer
    $u,v,d$. Conjugating a power changes the sign of the $\sqrt d$ coefficient and preserves the rational
    coefficient.


    Rationalize $\sqrt{n^2+1}-n$ by multiplying by the conjugate to get $1/(\sqrt{n^2+1}+n)$, avoiding
    subtraction of two large nearby values.


    The floor $\lfloor x\rfloor$ is the greatest integer at most $x$. If $A$ is an integer and $0<t<1$,
    then $\lfloor A-t\rfloor=A-1$.


    Counting pairs $(d,k)$ with $dk\le N$ gives $\sum_{n=1}^N\tau(n)=\sum_{d=1}^N\lfloor N/d\rfloor$,
    where $\tau$ counts positive divisors. Weight each pair by $d$ to obtain the analogous divisor-sum
    formula.'
questions:
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 24, p. 379 ; engel-14-24 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-01
  type: numeric
  difficulte: 1
  enonce:
    fr: Calcule $(1+\sqrt2)(1-\sqrt2)$.
    en: Compute $(1+\sqrt2)(1-\sqrt2)$.
  reponse: '-1'
  explication:
    fr: La différence de carrés donne $1-2=-1$.
    en: The difference of squares is $1-2=-1$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 30, p. 380 ; engel-14-30 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-02
  type: numeric
  difficulte: 1
  enonce:
    fr: Calcule $\lfloor2+\sqrt3\rfloor$.
    en: Compute $\lfloor2+\sqrt3\rfloor$.
  reponse: '3'
  explication:
    fr: $1<\sqrt3<2$, donc $3<2+\sqrt3<4$.
    en: $1<\sqrt3<2$, so $3<2+\sqrt3<4$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 61, p. 383 ; engel-14-61 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-03
  type: numeric
  difficulte: 1
  enonce:
    fr: Combien de diviseurs positifs possède $6$ ?
    en: How many positive divisors does $6$ have?
  reponse: '4'
  explication:
    fr: 'Les diviseurs sont $1,2,3,6$ : quatre.'
    en: 'The divisors are $1,2,3,6$: four.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 24, p. 379 ; engel-14-24 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-04
  type: trous
  difficulte: 2
  enonce:
    fr: Pour $(1+\sqrt2)^2=x_2+y_2\sqrt2$, donne $(x_2,y_2)$.
    en: For $(1+\sqrt2)^2=x_2+y_2\sqrt2$, give $(x_2,y_2)$.
  explication:
    fr: Le carré vaut $1+2\sqrt2+2=3+2\sqrt2$.
    en: The square is $1+2\sqrt2+2=3+2\sqrt2$.
  texte:
    fr: $x_2=$ {{1}} ; $y_2=$ {{2}}.
    en: $x_2=$ {{1}}; $y_2=$ {{2}}.
  trous:
  - type: numeric
    reponse: '3'
  - type: numeric
    reponse: '2'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 61, p. 383 ; engel-14-61 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-05
  type: numeric
  difficulte: 2
  enonce:
    fr: Calcule $\sum_{n=1}^4\tau(n)$, où $\tau(n)$ compte les diviseurs positifs.
    en: Compute $\sum_{n=1}^4\tau(n)$, where $\tau(n)$ counts positive divisors.
  reponse: '8'
  explication:
    fr: Les comptes pour $1,2,3,4$ sont $1,2,2,3$, de somme $8$.
    en: The counts for $1,2,3,4$ are $1,2,2,3$, summing to $8$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 26, p. 379 ; engel-14-26 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-06
  type: expression
  difficulte: 2
  enonce:
    fr: 'Rationalise $\sqrt{n^2+1}-n$ : donne une expression sans soustraction au numérateur.'
    en: 'Rationalize $\sqrt{n^2+1}-n$: give an expression with no subtraction in the numerator.'
  reponse: 1/(sqrt(n^2+1)+n)
  explication:
    fr: Le produit des deux conjugués vaut $(n^2+1)-n^2=1$.
    en: The product of the conjugates is $(n^2+1)-n^2=1$.
  variables:
  - n
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 26, p. 379 ; engel-14-26 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-07
  type: numeric
  difficulte: 3
  enonce:
    fr: Trouve $\lim_{n\to\infty}n(\sqrt{n^2+1}-n)$.
    en: Find $\lim_{n\to\infty}n(\sqrt{n^2+1}-n)$.
  reponse: 1/2
  explication:
    fr: Rationaliser puis diviser par $n$ donne $1/(\sqrt{1+1/n^2}+1)\to1/2$.
    en: Rationalize and divide by $n$ to obtain $1/(\sqrt{1+1/n^2}+1)\to1/2$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 30, p. 380 ; engel-14-30 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-08
  type: numeric
  difficulte: 3
  enonce:
    fr: Calcule $\lfloor(2+\sqrt3)^2\rfloor$ sans approximation décimale.
    en: Compute $\lfloor(2+\sqrt3)^2\rfloor$ without decimal approximations.
  reponse: '13'
  explication:
    fr: La somme avec le conjugué vaut $14$. Le conjugué $(2-\sqrt3)^2$ est strictement entre $0$ et $1$,
      donc la partie entière vaut $13$.
    en: The sum with its conjugate is $14$. The conjugate $(2-\sqrt3)^2$ lies strictly between $0$ and
      $1$, so the floor is $13$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 62, p. 383 ; engel-14-62 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-09
  type: numeric
  difficulte: 3
  enonce:
    fr: Quelle est $\sum_{n=1}^4\sigma(n)$, où $\sigma(n)$ est la somme des diviseurs positifs ?
    en: What is $\sum_{n=1}^4\sigma(n)$, where $\sigma(n)$ is the sum of positive divisors?
  reponse: '15'
  explication:
    fr: Les sommes sont $1,3,4,7$, de total $15$. On retrouve $1\lfloor4/1\rfloor+2\lfloor4/2\rfloor+3\lfloor4/3\rfloor+4\lfloor4/4\rfloor=15$.
    en: The sums are $1,3,4,7$, totaling $15$. Equivalently $1\lfloor4/1\rfloor+2\lfloor4/2\rfloor+3\lfloor4/3\rfloor+4\lfloor4/4\rfloor=15$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 24, p. 379 ; engel-14-24 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-10
  type: vrai-faux
  difficulte: 4
  enonce:
    fr: Si $(1+\sqrt2)^n=x_n+y_n\sqrt2$, alors $x_n^2-2y_n^2=(-1)^n$.
    en: If $(1+\sqrt2)^n=x_n+y_n\sqrt2$, then $x_n^2-2y_n^2=(-1)^n$.
  reponse: true
  explication:
    fr: 'Multiplie par le conjugué $(1-\sqrt2)^n$ : le produit vaut $[(1+\sqrt2)(1-\sqrt2)]^n=(-1)^n$.'
    en: 'Multiply by the conjugate $(1-\sqrt2)^n$: the product is $[(1+\sqrt2)(1-\sqrt2)]^n=(-1)^n$.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 61, p. 383 ; engel-14-61 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-11
  type: numeric
  difficulte: 4
  enonce:
    fr: Calcule $\sum_{n=1}^{10}\tau(n)$ par double comptage.
    en: Compute $\sum_{n=1}^{10}\tau(n)$ by double counting.
  reponse: '27'
  explication:
    fr: Pour chaque diviseur $d$, il existe $\lfloor10/d\rfloor$ multiples. La somme $10+5+3+2+2+1+1+1+1+1$
      vaut $27$.
    en: Each divisor $d$ occurs in $\lfloor10/d\rfloor$ multiples. The sum $10+5+3+2+2+1+1+1+1+1$ is $27$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 33, p. 380 ; engel-14-33 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-12
  type: expression
  difficulte: 4
  enonce:
    fr: 'Pour $t=1+\sqrt2+\sqrt3$, exprime $(t-1)^2-5$ sous la forme $c\sqrt6$ : donne $c$.'
    en: 'For $t=1+\sqrt2+\sqrt3$, write $(t-1)^2-5=c\sqrt6$: give $c$.'
  reponse: '2'
  explication:
    fr: $(\sqrt2+\sqrt3)^2=5+2\sqrt6$, donc $c=2$.
    en: $(\sqrt2+\sqrt3)^2=5+2\sqrt6$, so $c=2$.
  variables: []
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 30, p. 380 ; engel-14-30 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-13
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Pour tout entier $n\ge1$, $\lfloor(2+\sqrt3)^n\rfloor$ est impair.
    en: For every integer $n\ge1$, $\lfloor(2+\sqrt3)^n\rfloor$ is odd.
  reponse: true
  explication:
    fr: La trace $S_n=(2+\sqrt3)^n+(2-\sqrt3)^n$ est entière et vérifie $S_0=2$, $S_1=4$, $S_{n+2}=4S_{n+1}-S_n$,
      donc elle est paire. Comme $0<(2-\sqrt3)^n<1$, la partie entière vaut $S_n-1$, impair.
    en: The trace $S_n=(2+\sqrt3)^n+(2-\sqrt3)^n$ is an integer with $S_0=2$, $S_1=4$, $S_{n+2}=4S_{n+1}-S_n$,
      hence even. Since $0<(2-\sqrt3)^n<1$, the floor is $S_n-1$, which is odd.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 33, p. 380 ; engel-14-33 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-14
  type: expression
  difficulte: 5
  enonce:
    fr: Donne un polynôme unitaire de degré $4$ à coefficients entiers qui s’annule en $x=1+\sqrt2+\sqrt3$.
    en: Give a monic degree-$4$ integer-coefficient polynomial vanishing at $x=1+\sqrt2+\sqrt3$.
  reponse: ((x-1)^2-5)^2-24
  explication:
    fr: On a $(x-1)^2-5=2\sqrt6$. Élever au carré donne $[(x-1)^2-5]^2-24=0$. Les changements indépendants
      de signe de $\sqrt2,\sqrt3$ donnent les quatre racines distinctes.
    en: We have $(x-1)^2-5=2\sqrt6$. Squaring gives $[(x-1)^2-5]^2-24=0$. Independent sign changes of
      $\sqrt2,\sqrt3$ give four distinct roots.
  variables:
  - x
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 14 (Further Strategies), problème 62, p. 383 ; engel-14-62 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: strategies-conjugues-15
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Pour tout entier $N\ge1$, $\sum_{n=1}^N\sigma(n)=\sum_{d=1}^N d\lfloor N/d\rfloor$.
    en: For every integer $N\ge1$, $\sum_{n=1}^N\sigma(n)=\sum_{d=1}^N d\lfloor N/d\rfloor$.
  reponse: true
  explication:
    fr: Compte les couples $(d,k)$ d’entiers positifs tels que $dk\le N$, en donnant à chacun le poids
      $d$. Regrouper par produit $n=dk$ donne la somme des diviseurs ; regrouper par $d$ donne $d\lfloor
      N/d\rfloor$.
    en: Count positive integer pairs $(d,k)$ with $dk\le N$, each weighted by $d$. Grouping by product
      $n=dk$ gives divisor sums; grouping by $d$ gives $d\lfloor N/d\rfloor$.
