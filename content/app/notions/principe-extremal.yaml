id: principe-extremal
theme: combinatoire
niveau: 2
chapitre: 02-principe-extremal
titre:
  fr: Le principe extrémal
  en: The extremal principle
fiche:
  fr: |
    **Tout ensemble non vide d'entiers naturels a un plus petit élément**, et tout ensemble **fini** non vide de réels a un plus petit et un plus grand élément. Ce n'est plus garanti pour un ensemble infini de réels : $]0; 1]$ n'a pas de plus petit élément.

    Méthode : considérer l'objet **extrême** (le plus petit, le plus grand, le plus long…), après avoir justifié qu'il existe, puis exploiter ce choix ; souvent, on montre qu'un objet encore plus extrême existerait : contradiction.

    Variante : la **descente infinie** (une suite strictement décroissante d'entiers naturels est finie).
  en: |
    **Every non-empty set of natural numbers has a least element**, and every **finite** non-empty set of reals has a least and a greatest element. This is no longer guaranteed for an infinite set of reals: $(0, 1]$ has no least element.

    Method: consider the **extremal** object (smallest, largest, longest…), after checking that it exists, then use this choice; often, one shows that an even more extremal object would exist: contradiction.

    Variant: **infinite descent** (a strictly decreasing sequence of natural numbers is finite).
questions:
  - id: px-01
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Tout ensemble non vide de réels strictement positifs a un plus petit élément."
      en: "Every non-empty set of strictly positive real numbers has a least element."
    reponse: false
    explication:
      fr: "Contre-exemple : $]0; 1]$ n'a pas de plus petit élément. Le principe vaut pour les **entiers naturels**, ou pour les ensembles **finis**."
      en: "Counterexample: $(0, 1]$ has no least element. The principle holds for **natural numbers**, or for **finite** sets."

  - id: px-02
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Tout ensemble fini et non vide de réels a un plus grand élément."
      en: "Every finite non-empty set of real numbers has a greatest element."
    reponse: true
    explication:
      fr: "On compare les éléments un à un : après un nombre fini de comparaisons, on obtient le plus grand."
      en: "Compare the elements one by one: after finitely many comparisons we get the greatest."

  - id: px-03
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit entier $n \\ge 1$ tel que $7$ divise $2^n - 1$ ?"
      en: "What is the smallest integer $n \\ge 1$ such that $7$ divides $2^n - 1$?"
    reponse: "3"
    explication:
      fr: "$2^1 - 1 = 1$, $2^2 - 1 = 3$, $2^3 - 1 = 7$. Ce plus petit $n$ (l'ordre de $2$ modulo $7$) existe par le principe du plus petit élément."
      en: "$2^1 - 1 = 1$, $2^2 - 1 = 3$, $2^3 - 1 = 7$. This least $n$ (the order of $2$ modulo $7$) exists by the least element principle."

  - id: px-04
    type: ordre
    difficulte: 3
    enonce:
      fr: "Remets dans l'ordre la preuve que $\\sqrt 2$ est irrationnel, et écarte l'étape fausse."
      en: "Put back in order the proof that $\\sqrt 2$ is irrational, and discard the wrong step."
    etapes:
      - { fr: "Supposons $\\sqrt 2 = \\frac{p}{q}$ avec $p, q$ entiers positifs, et choisissons $q$ **le plus petit possible**.", en: "Assume $\\sqrt 2 = \\frac{p}{q}$ with positive integers $p, q$, and choose $q$ **as small as possible**." }
      - { fr: "Alors $p^2 = 2q^2$ : $p^2$ est pair, donc $p$ est pair, $p = 2r$.", en: "Then $p^2 = 2q^2$: $p^2$ is even, so $p$ is even, $p = 2r$." }
      - { fr: "Donc $4r^2 = 2q^2$, soit $q^2 = 2r^2$ : $q$ est pair, $q = 2s$.", en: "So $4r^2 = 2q^2$, i.e. $q^2 = 2r^2$: $q$ is even, $q = 2s$." }
      - { fr: "Ainsi $\\sqrt 2 = \\frac{r}{s}$ avec $s = \\frac{q}{2} < q$.", en: "Hence $\\sqrt 2 = \\frac{r}{s}$ with $s = \\frac{q}{2} < q$." }
      - { fr: "Cela contredit le choix de $q$ minimal : $\\sqrt 2$ est irrationnel.", en: "This contradicts the minimal choice of $q$: $\\sqrt 2$ is irrational." }
    intrus:
      - { fr: "Donc $p^2 = 4q^2$.", en: "So $p^2 = 4q^2$." }
    explication:
      fr: "Le choix d'un $q$ **minimal** est le cœur de la preuve : on fabrique une écriture avec un dénominateur plus petit, ce qui est impossible."
      en: "Choosing a **minimal** $q$ is the heart of the proof: we build a fraction with a smaller denominator, which is impossible."

  - id: px-05
    type: qcm
    difficulte: 2
    enonce:
      fr: "Pour montrer qu'une suite strictement décroissante d'entiers naturels ne peut pas être infinie, on utilise :"
      en: "To show that a strictly decreasing sequence of natural numbers cannot be infinite, we use:"
    choix:
      - { fr: "Tout ensemble non vide d'entiers naturels a un plus petit élément.", en: "Every non-empty set of natural numbers has a least element." }
      - { fr: "Tout ensemble de réels a un plus petit élément.", en: "Every set of reals has a least element." }
      - { fr: "Le principe des tiroirs.", en: "The pigeonhole principle." }
    bonnes: [0]
    explication:
      fr: "L'ensemble des termes de la suite a un plus petit élément ; le terme suivant serait encore plus petit : contradiction."
      en: "The set of terms has a least element; the next term would be even smaller: contradiction."

  - id: px-06
    type: preuve
    difficulte: 4
    enonce:
      fr: "Montre qu'il n'existe pas d'entiers strictement positifs $x, y, z$ tels que $x^3 + 2y^3 = 4z^3$."
      en: "Show that there are no positive integers $x, y, z$ such that $x^3 + 2y^3 = 4z^3$."
    elements_attendus:
      fr: "Considérer une solution avec $x$ minimal ; $x^3$ pair donc $x = 2x_1$ ; puis $y = 2y_1$, puis $z = 2z_1$ ; $(x_1, y_1, z_1)$ est une solution plus petite : contradiction (descente infinie)."
      en: "Take a solution with minimal $x$; $x^3$ is even so $x = 2x_1$; then $y = 2y_1$, then $z = 2z_1$; $(x_1, y_1, z_1)$ is a smaller solution: contradiction (infinite descent)."
    bareme: 4
    explication:
      fr: "Preuve validée par ton encadreur : il vérifie le choix d'une solution minimale et chaque étape de parité."
      en: "Proof checked by your coach: they verify the choice of a minimal solution and each parity step."

  - id: px-07
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Tout ensemble non vide d'entiers naturels a un plus petit élément."
      en: "Every non-empty set of natural numbers has a smallest element."
    reponse: true
    explication:
      fr: "C'est le principe du bon ordre (ou du plus petit élément) sur $\\mathbb N$."
      en: "This is the well-ordering principle on $\\mathbb N$."

  - id: px-08
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Tout ensemble non vide d'entiers relatifs a un plus petit élément."
      en: "Every non-empty set of integers has a smallest element."
    reponse: false
    explication:
      fr: "Contre-exemple : $\\mathbb Z$ lui-même (ou l'ensemble des entiers négatifs) n'a pas de plus petit élément."
      en: "Counterexample: $\\mathbb Z$ itself (or the set of negative integers) has no smallest element."

  - id: px-09
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Tout ensemble non vide d'entiers relatifs **minoré** a un plus petit élément."
      en: "Every non-empty set of integers that is **bounded below** has a smallest element."
    reponse: true
    explication:
      fr: "Si $m$ est un minorant, on translate : $\\{x - m\\}$ est un ensemble non vide d'entiers naturels, qui a un plus petit élément."
      en: "If $m$ is a lower bound, shift: $\\{x - m\\}$ is a non-empty set of natural numbers, which has a smallest element."

  - id: px-10
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Tout ensemble non vide d'entiers naturels **majoré** a un plus grand élément."
      en: "Every non-empty set of natural numbers that is **bounded above** has a largest element."
    reponse: true
    explication:
      fr: "Un tel ensemble est fini (contenu dans $\\{0, \\dots, M\\}$) : on compare ses éléments."
      en: "Such a set is finite (contained in $\\{0, \\dots, M\\}$): compare its elements."

  - id: px-11
    type: qcm
    difficulte: 2
    enonce:
      fr: "Quels ensembles n'ont **pas** de plus petit élément ?"
      en: "Which set has **no** smallest element?"
    choix:
      - { fr: "$\\{x \\in \\mathbb R : x > 0\\}$", en: "$\\{x \\in \\mathbb R : x > 0\\}$" }
      - { fr: "$\\{n \\in \\mathbb N : n > 5\\}$", en: "$\\{n \\in \\mathbb N : n > 5\\}$" }
      - { fr: "$\\{n^2 : n \\in \\mathbb N\\}$", en: "$\\{n^2 : n \\in \\mathbb N\\}$" }
    bonnes: [0]
    explication:
      fr: "$\\{x \\in \\mathbb R : x > 0\\}$ n'en a pas : pour tout $x > 0$, $\\frac x2$ est plus petit. Les deux autres ont un plus petit élément ($6$ et $0$)."
      en: "$\\{x \\in \\mathbb R : x > 0\\}$ has none: for any $x > 0$, $\\frac x2$ is smaller. The other two have a smallest element ($6$ and $0$)."

  - id: px-12
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit entier $n \\ge 1$ tel que $n!$ soit divisible par $1000$ ?"
      en: "What is the smallest integer $n \\ge 1$ such that $n!$ is divisible by $1000$?"
    reponse: "15"
    explication:
      fr: "$1000 = 2^3\\cdot5^3$. Il faut trois facteurs $5$ : $\\lfloor n/5\\rfloor + \\lfloor n/25\\rfloor \\ge 3$, ce qui donne $n \\ge 15$ (pour $n = 14$ il n'y en a que $2$). Les facteurs $2$ sont largement suffisants."
      en: "$1000 = 2^3\\cdot5^3$. We need three factors $5$: $\\lfloor n/5\\rfloor + \\lfloor n/25\\rfloor \\ge 3$, giving $n \\ge 15$ (for $n = 14$ there are only $2$). Factors $2$ are more than enough."

  - id: px-13
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit entier $n \\ge 1$ tel que $11$ divise $3^n - 1$ ?"
      en: "What is the smallest integer $n \\ge 1$ such that $11$ divides $3^n - 1$?"
    reponse: "5"
    explication:
      fr: "$3^1 = 3$, $3^2 = 9$, $3^3 = 27 \\equiv 5$, $3^4 \\equiv 15 \\equiv 4$, $3^5 \\equiv 12 \\equiv 1 \\pmod{11}$. Ce plus petit $n$ existe par le principe du plus petit élément."
      en: "$3^1 = 3$, $3^2 = 9$, $3^3 = 27 \\equiv 5$, $3^4 \\equiv 15 \\equiv 4$, $3^5 \\equiv 12 \\equiv 1 \\pmod{11}$. This smallest $n$ exists by the least element principle."

  - id: px-14
    type: qcm
    difficulte: 2
    enonce:
      fr: "Pour montrer par **descente infinie** qu'une équation n'a pas de solution en entiers strictement positifs, on commence par considérer :"
      en: "To show by **infinite descent** that an equation has no solution in positive integers, one starts by considering:"
    choix:
      - { fr: "une solution minimale", en: "a minimal solution" }
      - { fr: "une solution maximale", en: "a maximal solution" }
      - { fr: "une solution quelconque, sans condition", en: "any solution, with no condition" }
    bonnes: [0]
    explication:
      fr: "On prend une solution **minimale** (par exemple avec $x$ minimal) et on en fabrique une plus petite : contradiction."
      en: "Take a **minimal** solution (for example with minimal $x$) and build a smaller one: contradiction."

  - id: px-15
    type: vrai-faux
    difficulte: 3
    enonce:
      fr: "L'équation $x^2 + y^2 = 3z^2$ n'a pas de solution en entiers $x, y, z$ non tous nuls."
      en: "The equation $x^2 + y^2 = 3z^2$ has no solution in integers $x, y, z$ not all zero."
    reponse: true
    explication:
      fr: "Les carrés valent $0$ ou $1$ modulo $3$ : $x^2 + y^2 \\equiv 0$ force $x \\equiv y \\equiv 0 \\pmod 3$. Alors $9$ divise $3z^2$, donc $3 \\mid z$. Avec une solution de $|x| + |y| + |z|$ minimal non nul, $(x/3, y/3, z/3)$ en est une plus petite : contradiction."
      en: "Squares are $0$ or $1$ modulo $3$: $x^2 + y^2 \\equiv 0$ forces $x \\equiv y \\equiv 0 \\pmod 3$. Then $9$ divides $3z^2$, so $3 \\mid z$. Take a non-zero solution with $|x| + |y| + |z|$ minimal: $(x/3, y/3, z/3)$ is a smaller one: contradiction."

  - id: px-16
    type: numeric
    difficulte: 2
    enonce:
      fr: "Parmi tous les rectangles de périmètre $20$ (côtés réels), quelle est l'aire maximale ?"
      en: "Among all rectangles with perimeter $20$ (real sides), what is the largest area?"
    reponse: "25"
    explication:
      fr: "Côtés $x$ et $10 - x$ : aire $x(10 - x) = 25 - (x - 5)^2 \\le 25$, avec égalité pour $x = 5$ (le carré)."
      en: "Sides $x$ and $10 - x$: area $x(10 - x) = 25 - (x - 5)^2 \\le 25$, with equality for $x = 5$ (the square)."

  - id: px-17
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quelle est la plus petite valeur prise par $x^2 - 6x + 13$ lorsque $x$ décrit les réels ?"
      en: "What is the smallest value taken by $x^2 - 6x + 13$ for real $x$?"
    reponse: "4"
    explication:
      fr: "$x^2 - 6x + 13 = (x - 3)^2 + 4 \\ge 4$, avec égalité pour $x = 3$."
      en: "$x^2 - 6x + 13 = (x - 3)^2 + 4 \\ge 4$, with equality for $x = 3$."

  - id: px-18
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quelle est la plus petite valeur de $x + \\dfrac1x$ pour $x > 0$ ?"
      en: "What is the smallest value of $x + \\dfrac1x$ for $x > 0$?"
    reponse: "2"
    explication:
      fr: "$x + \\frac1x - 2 = \\frac{(x - 1)^2}{x} \\ge 0$, avec égalité pour $x = 1$."
      en: "$x + \\frac1x - 2 = \\frac{(x - 1)^2}{x} \\ge 0$, with equality for $x = 1$."

  - id: px-19
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quelle est la plus grande valeur de $ab$ pour des entiers $a, b \\ge 1$ tels que $a + b = 12$ ?"
      en: "What is the largest value of $ab$ for integers $a, b \\ge 1$ with $a + b = 12$?"
    reponse: "36"
    explication:
      fr: "$ab = 36 - (a - 6)^2 \\le 36$, avec égalité pour $a = b = 6$."
      en: "$ab = 36 - (a - 6)^2 \\le 36$, with equality for $a = b = 6$."

  - id: px-20
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit diviseur strictement supérieur à $1$ de $2491$ ?"
      en: "What is the smallest divisor of $2491$ greater than $1$?"
    reponse: "47"
    explication:
      fr: "On essaie les premiers : $2491$ n'est divisible ni par $2, 3, 5, 7, 11, \\dots, 43$ ; $2491 = 47\\times53$. Le plus petit diviseur $> 1$ d'un entier est toujours un nombre premier."
      en: "Try primes: $2491$ is divisible by none of $2, 3, 5, 7, 11, \\dots, 43$; $2491 = 47\\times53$. The smallest divisor $> 1$ of an integer is always prime."

  - id: px-21
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Le plus petit diviseur strictement supérieur à $1$ d'un entier $n \\ge 2$ est toujours un nombre premier."
      en: "The smallest divisor greater than $1$ of an integer $n \\ge 2$ is always prime."
    reponse: true
    explication:
      fr: "Si ce plus petit diviseur $d$ s'écrivait $d = ab$ avec $1 < a < d$, alors $a$ diviserait aussi $n$ et serait plus petit que $d$ : contradiction."
      en: "If this smallest divisor $d$ were $d = ab$ with $1 < a < d$, then $a$ would also divide $n$ and be smaller than $d$: contradiction."

  - id: px-22
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit entier strictement positif dont l'écriture décimale n'utilise que le chiffre $1$ et qui est divisible par $7$ ?"
      en: "What is the smallest positive integer whose decimal expansion uses only the digit $1$ and that is divisible by $7$?"
    reponse: "111111"
    explication:
      fr: "$1, 11, 111, 1111, 11111$ ne sont pas multiples de $7$ ; $111111 = 7\\times15873$."
      en: "$1, 11, 111, 1111, 11111$ are not multiples of $7$; $111111 = 7\\times15873$."

  - id: px-23
    type: numeric
    difficulte: 2
    enonce:
      fr: "Une suite d'entiers naturels strictement décroissante commence par $a_0 = 20$. Combien de termes peut-elle avoir au maximum ?"
      en: "A strictly decreasing sequence of natural numbers starts with $a_0 = 20$. What is the maximum number of terms?"
    reponse: "21"
    explication:
      fr: "Les termes sont des éléments distincts de $\\{0, 1, \\dots, 20\\}$ : au plus $21$ termes, atteint par $20, 19, \\dots, 0$."
      en: "The terms are distinct elements of $\\{0, 1, \\dots, 20\\}$: at most $21$ terms, achieved by $20, 19, \\dots, 0$."

  - id: px-24
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel est le plus petit entier $n$ tel que $n(n+1)/2 \\ge 100$ ?"
      en: "What is the smallest integer $n$ such that $n(n+1)/2 \\ge 100$?"
    reponse: "14"
    explication:
      fr: "$13\\cdot14/2 = 91 < 100$ et $14\\cdot15/2 = 105 \\ge 100$. (Cet ensemble d'entiers est non vide, donc il a un plus petit élément.)"
      en: "$13\\cdot14/2 = 91 < 100$ and $14\\cdot15/2 = 105 \\ge 100$. (This set of integers is non-empty, so it has a smallest element.)"

  - id: px-25
    type: numeric
    difficulte: 1
    enonce:
      fr: "Quel est le plus petit entier $n$ tel que $2^n > 10^6$ ?"
      en: "What is the smallest integer $n$ such that $2^n > 10^6$?"
    reponse: "20"
    explication:
      fr: "$2^{19} = 524288 < 10^6$ et $2^{20} = 1048576 > 10^6$."
      en: "$2^{19} = 524288 < 10^6$ and $2^{20} = 1048576 > 10^6$."
