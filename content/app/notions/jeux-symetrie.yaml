id: jeux-symetrie
theme: combinatoire
niveau: 4
titre:
  fr: Symétrie et appariements
  en: Symmetry and pairing
fiche:
  fr: 'Une stratégie par appariement associe les cases deux à deux. Après le coup adverse, on répond sur
    la case associée. Il faut prouver qu’elle est libre et que le coup respecte toutes les règles, notamment
    les attaques des pièces.


    Un cavalier se déplace de $(\pm2,\pm1)$ ou $(\pm1,\pm2)$ et change la couleur de case. Un fou reste
    sur la même couleur. Une symétrie qui conserve le plateau n’est donc pas automatiquement une stratégie
    légale.


    Pour un parcours sans revisite sur un plateau quadrillé, un appariement par dominos fournit une réponse
    voisine : après l’entrée de l’adversaire dans un domino intact, sortir par l’autre case. Dans le jeu
    marquer/couvrir, B reste libre de son domino : un pavage fixé par A ne suffit pas à forcer les réponses.'
  en: 'A pairing strategy matches cells in pairs. After the opponent moves, respond on the paired cell.
    Prove that it is free and that the response obeys every rule, including piece attacks.


    A knight moves by $(\pm2,\pm1)$ or $(\pm1,\pm2)$ and changes cell color. A bishop remains on the same
    color. A board symmetry is therefore not automatically a legal strategy.


    For a path with no revisits on a grid, a domino matching provides an adjacent response: after the
    opponent enters an untouched domino, leave through its other cell. In the mark/cover game, B may choose
    any legal domino: A fixing a tiling does not force B to follow it.'
questions:
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 5, p. 363 ; engel-13-05 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-01
  type: numeric
  difficulte: 1
  enonce:
    fr: Combien de cases possède l’échiquier $8\times8$ du jeu des cavaliers ?
    en: How many cells does the $8\times8$ board in the knight game have?
  reponse: '64'
  explication:
    fr: $8\cdot8=64$.
    en: $8\cdot8=64$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 5, p. 363 ; engel-13-05 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-02
  type: vrai-faux
  difficulte: 1
  enonce:
    fr: Un cavalier change toujours de couleur de case à chaque coup légal.
    en: A knight always changes cell color on each legal move.
  reponse: true
  explication:
    fr: 'La somme des coordonnées change d’un nombre impair : $\pm2\pm1$.'
    en: 'The coordinate sum changes by an odd number: $\pm2\pm1$.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 6, p. 363 ; engel-13-06 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-03
  type: vrai-faux
  difficulte: 1
  enonce:
    fr: Un fou peut passer d’une case noire à une case blanche par un coup légal.
    en: A bishop can move from a black cell to a white cell in one legal move.
  reponse: false
  explication:
    fr: Un déplacement diagonal change les deux coordonnées de même amplitude ; leur somme conserve sa
      parité.
    en: A diagonal move changes both coordinates by the same magnitude, preserving the parity of their
      sum.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 5, p. 363 ; engel-13-05 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-04
  type: n-uplet
  difficulte: 2
  enonce:
    fr: Les cases sont $(r,c)$, $1\le r,c\le8$. Quelle est l’image de $(2,3)$ par le demi-tour central
      ?
    en: Cells are $(r,c)$, $1\le r,c\le8$. What is the image of $(2,3)$ under central half-turn?
  reponse:
  - 7
  - 6
  explication:
    fr: La transformation est $(r,c)\mapsto(9-r,9-c)$, donc $(7,6)$.
    en: The map is $(r,c)\mapsto(9-r,9-c)$, giving $(7,6)$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 35, p. 365 ; engel-13-35 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-05
  type: numeric
  difficulte: 2
  enonce:
    fr: Combien de dominos faut-il pour paver le plateau $2n\times2n$ quand $n=3$ ?
    en: How many dominoes tile a $2n\times2n$ board when $n=3$?
  reponse: '18'
  explication:
    fr: Le plateau a $36$ cases ; chaque domino en couvre deux, donc $18$.
    en: The board has $36$ cells; each domino covers two, so $18$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 21, p. 364 ; engel-13-21 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-06
  type: vrai-faux
  difficulte: 2
  enonce:
    fr: Un plateau $4\times4$ peut être partagé en paires de cases voisines horizontalement.
    en: A $4\times4$ board can be partitioned into horizontally adjacent cell pairs.
  reponse: true
  explication:
    fr: Dans chaque ligne, apparier les colonnes $1,2$ puis $3,4$ couvre toutes les cases sans chevauchement.
    en: In each row, pair columns $1,2$ and $3,4$, covering all cells without overlap.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 5, p. 363 ; engel-13-05 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-07
  type: vrai-faux
  difficulte: 3
  enonce:
    fr: Sur $8\times8$, une case et son image par demi-tour ont la même couleur ; un cavalier ne les relie
      donc jamais.
    en: On an $8\times8$ board, a cell and its half-turn image have the same color, so no knight move
      connects them.
  reponse: true
  explication:
    fr: Les sommes des coordonnées sont $r+c$ et $18-r-c$, de même parité. Un cavalier change de parité.
    en: The coordinate sums are $r+c$ and $18-r-c$, of equal parity. A knight changes parity.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 6, p. 363 ; engel-13-06 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-08
  type: vrai-faux
  difficulte: 3
  enonce:
    fr: Sur $8\times8$, la réflexion $(r,c)\mapsto(r,9-c)$ change la couleur de case.
    en: On $8\times8$, reflection $(r,c)\mapsto(r,9-c)$ changes cell color.
  reponse: true
  explication:
    fr: La différence des sommes vaut $9-2c$, impair. Deux fous placés sur ces cases ne s’attaquent pas.
    en: The difference between coordinate sums is $9-2c$, which is odd. Bishops on those cells cannot
      attack each other.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 35, p. 365 ; engel-13-35 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-09
  type: vrai-faux
  difficulte: 3
  enonce:
    fr: Dans le jeu marquer/couvrir, fixer un pavage de dominos suffit à obliger B à couvrir chaque case
      marquée par son partenaire dans ce pavage.
    en: In the mark/cover game, fixing a domino tiling suffices to force B to cover each marked cell with
      its partner in that tiling.
  reponse: false
  explication:
    fr: B choisit tout domino légal contenant la case marquée ; il n’est pas tenu de suivre le pavage
      fixé. Une preuve de stratégie doit expliquer comment A impose effectivement ses choix.
    en: B may choose any legal domino containing the marked cell and need not follow the fixed tiling.
      A strategy proof must explain how A actually forces its choices.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 5, p. 363 ; engel-13-05 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-10
  type: vrai-faux
  difficulte: 4
  enonce:
    fr: Dans le jeu de placement de cavaliers blancs/noirs, B peut répondre au demi-tour du cavalier que
      A vient de placer.
    en: In the white/black knight placement game, B can reply at the half-turn image of the knight A just
      placed.
  reponse: true
  explication:
    fr: 'La case image est libre par l’invariant de symétrie. Elle ne peut être attaquée par un ancien
      cavalier blanc : par demi-tour, cela signifierait que le nouveau cavalier blanc attaque un ancien
      noir, interdit au coup de A. Elle n’est pas attaquée par le nouveau cavalier blanc car leurs cases
      ont la même couleur.'
    en: The image is free by the symmetry invariant. If an earlier white knight attacked it, rotation
      would show that the new white knight attacks an earlier black one, contradicting legality of A’s
      move. The new white knight cannot attack its image because the cells share a color.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 6, p. 363 ; engel-13-06 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-11
  type: vrai-faux
  difficulte: 4
  enonce:
    fr: Dans le jeu de placement de fous blancs/noirs, B peut répondre par la réflexion verticale $(r,c)\mapsto(r,9-c)$.
    en: In the white/black bishop placement game, B can reply by vertical reflection $(r,c)\mapsto(r,9-c)$.
  reponse: true
  explication:
    fr: La réflexion préserve les attaques diagonales et échange les couleurs des cases ; le nouveau fou
      n’attaque donc pas son image. Une attaque par un ancien fou se réfléchirait en une attaque interdite
      lors du coup de A. La case image est libre par symétrie.
    en: Reflection preserves diagonal attacks and switches cell color, so the new bishop cannot attack
      its image. An attack from an earlier bishop would reflect to a forbidden attack on A’s move. The
      image cell is free by symmetry.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 21, p. 364 ; engel-13-21 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-12
  type: vrai-faux
  difficulte: 4
  enonce:
    fr: 'Variante COMIMa (uniquement les cases partageant un côté) : Un appariement par dominos prouve
      que le premier joueur gagne le parcours sans revisite, depuis un coin d’un plateau de côté pair,
      avec déplacements vers une case voisine partageant un côté.'
    en: 'COMIMa variant (side-adjacent cells only): A domino matching proves the first player wins a no-revisit
      path from a corner of an even-sided board, using side-adjacent moves.'
  reponse: true
  explication:
    fr: 'Le coin est déjà visité. Le premier joueur entre dans son partenaire. Ensuite, après chaque entrée
      adverse dans un domino intact, il va à l’autre case. Après ses coups, les cases visitées forment
      des dominos complets : une réponse légale existe toujours.'
    en: The corner is already visited. The first player enters its partner. After each opponent entry
      into an untouched domino, move to the other cell. After the first player’s turns, visited cells
      form complete dominoes, so a legal reply always exists.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 22, p. 364 ; engel-13-22 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-13
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Un appariement du plateau $8\times8$ en paires reliées par un coup de cavalier permet à A, qui
      choisit d’abord la case de départ, de répondre ensuite à tous les coups de B sans revisite.
    en: A matching of the $8\times8$ board into knight-adjacent pairs lets A, who first chooses the starting
      cell, respond to every later B move without revisits.
  reponse: false
  explication:
    fr: Après le choix de la case de départ par A, c’est B qui peut rejoindre son partenaire. Ensuite
      B répond à chaque coup de A par le partenaire. L’argument d’appariement favorise B, pas A ; il suppose
      aussi qu’un tel appariement soit fourni.
    en: After A chooses the initial cell, B can move to its partner. B then answers each A move at the
      paired cell. The matching argument favors B, not A, and still requires an actual matching.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 21, p. 364 ; engel-13-21 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-14
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: 'Variante COMIMa (uniquement les cases partageant un côté) : Un plateau $(2m+1)\times(2m+1)$ privé
      d’un coin admet un appariement par dominos ; cela donne une stratégie gagnante au second joueur
      du parcours à déplacements par côtés depuis ce coin.'
    en: 'COMIMa variant (side-adjacent cells only): A $(2m+1)\times(2m+1)$ board with one corner removed
      has a domino matching; this gives the second player a winning strategy for the side-adjacent path
      starting at that corner.'
  reponse: true
  explication:
    fr: Après retrait du coin supérieur gauche, paver le reste de la première ligne horizontalement puis
      les $2m$ lignes restantes verticalement. Le premier joueur entre dans une paire intacte, et le second
      sort par son partenaire. Chaque réponse conserve des paires entièrement visitées.
    en: Remove the upper-left corner; tile the rest of its row horizontally, then the remaining $2m$ rows
      vertically. The first player enters an untouched pair, and the second moves to its partner, preserving
      complete visited pairs.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 13 (Games), problème 5, p. 363 ; engel-13-05 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: jeux-symetrie-15
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Toute symétrie sans case fixe donne automatiquement une stratégie de réponse légale dans tout
      jeu de placement de pièces.
    en: Every symmetry with no fixed cell automatically provides a legal response strategy in every piece-placement
      game.
  reponse: false
  explication:
    fr: 'Il faut aussi préserver les coups et empêcher qu’une pièce attaque sa propre image. Par exemple,
      un fou et son demi-tour peuvent être sur la même diagonale : les cases $(1,1)$ et $(8,8)$ s’attaquent.'
    en: 'One must also preserve legal moves and prevent a piece from attacking its own image. For example,
      a bishop and its half-turn image may share a diagonal: $(1,1)$ and $(8,8)$ attack each other.'
