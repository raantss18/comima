    enonce:
      fr: |
        Ce programme affiche `4`.

        ```python
        l = [1, 2, 3]
        m = l
        m.append(4)
        print(len(l))
        ```
      en: |
        This program prints `4`.

        ```python
        l = [1, 2, 3]
        m = l
        m.append(4)
        print(len(l))
        ```
    reponse: true
    explication:
      fr: "`m = l` ne copie pas la liste : `m` et `l` désignent **la même** liste. Ajouter à `m`, c'est ajouter à `l`. Pour une vraie copie : `m = l.copy()`. (Comparer avec pb-03 : un entier ne se modifie pas, on le remplace.)"
      en: "`m = l` does not copy the list: `m` and `l` refer to **the same** list. Appending to `m` appends to `l`. For a real copy: `m = l.copy()`. (Compare with pb-03: an integer is not modified, it is replaced.)"

