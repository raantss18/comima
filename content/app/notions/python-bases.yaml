  - id: pb-23
    type: code
    difficulte: 4
    langage: python
    fonction: chiffres
    enonce:
      fr: "Écris la fonction `chiffres(n)` qui renvoie la liste des chiffres de l'entier $n \\ge 0$, **dans l'ordre d'écriture** : `chiffres(2026)` donne `[2, 0, 2, 6]` et `chiffres(0)` donne `[0]`. N'utilise pas `str`."
      en: "Write the function `chiffres(n)` that returns the list of digits of the integer $n \\ge 0$, **in written order**: `chiffres(2026)` gives `[2, 0, 2, 6]` and `chiffres(0)` gives `[0]`. Do not use `str`."
    squelette:
      fr: |
        def chiffres(n):
            if n == 0:
                return [0]
            l = []
            # à compléter
            return l
      en: |
        def chiffres(n):
            if n == 0:
                return [0]
            l = []
            # to complete
            return l
    tests:
      - { entree: [2026], sortie: [2, 0, 2, 6] }
      - { entree: [0], sortie: [0] }
    tests_caches:
      - { entree: [7], sortie: [7] }
      - { entree: [1000], sortie: [1, 0, 0, 0] }
      - { entree: [987654321], sortie: [9, 8, 7, 6, 5, 4, 3, 2, 1] }
    reference: |
      def chiffres(n):
          if n == 0:
              return [0]
          l = []
          while n > 0:
              l.insert(0, n % 10)
              n = n // 10
          return l
    explication:
      fr: "`n % 10` donne le **dernier** chiffre et `n // 10` l'enlève ; les chiffres arrivent donc de droite à gauche. On les insère en tête (`l.insert(0, …)`), ou on les ajoute à la fin puis on renverse la liste. Le cas $n = 0$ est à part, car la boucle ne tournerait pas."
      en: "`n % 10` gives the **last** digit and `n // 10` removes it, so digits come from right to left. Insert them at the front (`l.insert(0, …)`), or append them and reverse the list at the end. The case $n = 0$ is separate because the loop would not run."

