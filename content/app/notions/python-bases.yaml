    difficulte: 1
    enonce:
      fr: "Que vaut `7 / 2` en Python ?"
      en: "What is `7 / 2` in Python?"
    choix:
      - { fr: "`3`", en: "`3`" }
      - { fr: "`3.5`", en: "`3.5`" }
      - { fr: "`4`", en: "`4`" }
      - { fr: "`1`", en: "`1`" }
    bonnes: [1]
    explication:
      fr: "`/` est la division exacte et donne un flottant : `3.5`. Le quotient entier s'écrit `7 // 2` (`3`) et le reste `7 % 2` (`1`)."
      en: "`/` is exact division and gives a float: `3.5`. The integer quotient is `7 // 2` (`3`) and the remainder `7 % 2` (`1`)."

