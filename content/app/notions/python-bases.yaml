      fr: "On teste chaque $d$ de $1$ à $n$ : $d$ divise $n$ quand `n % d == 0`. Pour aller plus vite, on peut ne tester que $d \\le \\sqrt n$ et compter $d$ et $n/d$ ensemble (attention aux carrés : $36 = 6 \\times 6$)."
      en: "Test every $d$ from $1$ to $n$: $d$ divides $n$ when `n % d == 0`. To go faster, test only $d \\le \\sqrt n$ and count $d$ and $n/d$ together (beware of squares: $36 = 6 \\times 6$)."

  - id: pb-25
    type: code
    difficulte: 4
    langage: python
    fonction: est_premier
    enonce:
      fr: "Écris la fonction `est_premier(n)` qui renvoie `True` si l'entier $n \\ge 0$ est premier et `False` sinon. Elle doit rester rapide pour $n$ proche d'un milliard : ne teste que les diviseurs $d$ tels que $d \\times d \\le n$."
      en: "Write the function `est_premier(n)` that returns `True` if the integer $n \\ge 0$ is prime and `False` otherwise. It must stay fast for $n$ close to a billion: only test divisors $d$ with $d \\times d \\le n$."
    squelette:
      fr: |
        def est_premier(n):
            if n < 2:
                return False
            d = 2
            # à compléter
            return True
      en: |
        def est_premier(n):
            if n < 2:
                return False
            d = 2
            # to complete
            return True
    tests:
      - { entree: [7], sortie: true }
      - { entree: [1], sortie: false }
    tests_caches:
      - { entree: [0], sortie: false }
      - { entree: [2], sortie: true }
      - { entree: [91], sortie: false }
      - { entree: [1681], sortie: false }
      - { entree: [999999937], sortie: true }
    reference: |
      def est_premier(n):
          if n < 2:
              return False
          d = 2
          while d * d <= n:
              if n % d == 0:
                  return False
              d += 1
          return True
    explication:
      fr: "Si $n = a \\times b$ avec $2 \\le a \\le b$, alors $a \\times a \\le n$ : il suffit de chercher un diviseur jusqu'à $\\sqrt n$, soit environ $31\\,600$ essais pour un milliard au lieu d'un milliard. $0$ et $1$ ne sont pas premiers ; $91 = 7 \\times 13$ et $1681 = 41^2$ non plus."
      en: "If $n = a \\times b$ with $2 \\le a \\le b$, then $a \\times a \\le n$: it is enough to look for a divisor up to $\\sqrt n$, about $31\\,600$ tries for a billion instead of a billion. $0$ and $1$ are not prime; neither are $91 = 7 \\times 13$ and $1681 = 41^2$."
