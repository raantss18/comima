id: polynomes-racines
theme: algèbre
niveau: 4
titre:
  fr: Racines, Viète et multiplicité
  en: Roots, Vieta and multiplicity
fiche:
  fr: 'Un zéro $r$ vérifie $P(r)=0$. Pour $x^2-Sx+T$, les deux racines complexes, comptées avec multiplicité,
    ont somme $S$ et produit $T$ (Viète). Ainsi $r_1^2+r_2^2=S^2-2T$.


    Un zéro est double si $(x-r)^2$ divise $P$ ; sur les réels ou complexes, cela équivaut à $P(r)=P''(r)=0$.
    Un polynôme non nul de degré $m$ a au plus $m$ racines distinctes. Pour minimiser un trinôme, complète
    le carré.


    Pour $r_i$ racines d’un trinôme, leurs puissances satisfont la récurrence obtenue en multipliant leur
    équation par une puissance de $r_i$. Justifie les conditions initiales avant de l’utiliser.'
  en: 'A zero $r$ satisfies $P(r)=0$. For $x^2-Sx+T$, the two complex roots counted with multiplicity
    have sum $S$ and product $T$ (Vieta). Hence $r_1^2+r_2^2=S^2-2T$.


    A root is double if $(x-r)^2$ divides $P$; over the reals or complexes, this means $P(r)=P''(r)=0$.
    A nonzero polynomial of degree $m$ has at most $m$ distinct roots. Complete the square to minimize
    a quadratic.


    Powers of quadratic roots satisfy the recurrence obtained by multiplying the root equation by a power
    of the root. Establish initial values before using it.'
questions:
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 2, p. 254 ; engel-10-02 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-01
  type: numeric
  difficulte: 1
  enonce:
    fr: Pour $x^2-(a-2)x-a-1$, prends $a=3$. Quelle est la somme des racines ?
    en: For $x^2-(a-2)x-a-1$, take $a=3$. What is the sum of the roots?
  reponse: '1'
  explication:
    fr: Viète donne $a-2=1$.
    en: Vieta gives $a-2=1$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 3, p. 254 ; engel-10-03 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-02
  type: numeric
  difficulte: 1
  enonce:
    fr: Les racines $r_1,r_2$ de $x^2-6x+1$ ont quel produit ?
    en: What is the product of the roots $r_1,r_2$ of $x^2-6x+1$?
  reponse: '1'
  explication:
    fr: 'Le terme constant d’un trinôme unitaire est le produit : $1$.'
    en: 'The constant coefficient of a monic quadratic is the product: $1$.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 17, p. 255 ; engel-10-17 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-03
  type: numeric
  difficulte: 1
  enonce:
    fr: Pose $P(x)=ax^4+bx^3+1$. Si $(x-1)^2$ divise $P$, combien vaut $a+b$ ?
    en: Let $P(x)=ax^4+bx^3+1$. If $(x-1)^2$ divides $P$, what is $a+b$?
  reponse: '-1'
  explication:
    fr: $P(1)=0$ impose $a+b+1=0$.
    en: $P(1)=0$ forces $a+b+1=0$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 2, p. 254 ; engel-10-02 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-04
  type: expression
  difficulte: 2
  enonce:
    fr: Exprime la somme des carrés des racines de $x^2-(a-2)x-a-1$ en fonction de $a$.
    en: Express the sum of the squares of the roots of $x^2-(a-2)x-a-1$ in terms of $a$.
  reponse: a^2-2*a+6
  explication:
    fr: 'Viète : $(a-2)^2-2(-a-1)=a^2-2a+6$.'
    en: 'Vieta: $(a-2)^2-2(-a-1)=a^2-2a+6$.'
  variables:
  - a
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 3, p. 254 ; engel-10-03 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-05
  type: numeric
  difficulte: 2
  enonce:
    fr: Pour les racines de $x^2-6x+1$, calcule $r_1^2+r_2^2$.
    en: For the roots of $x^2-6x+1$, compute $r_1^2+r_2^2$.
  reponse: '34'
  explication:
    fr: $S^2-2T=36-2=34$.
    en: $S^2-2T=36-2=34$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 23, p. 255 ; engel-10-23 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-06
  type: numeric
  difficulte: 2
  enonce:
    fr: Pose $P(x)=x^5-ax^2-ax+1$. Quelle est $P(-1)$, quel que soit $a$ ?
    en: Let $P(x)=x^5-ax^2-ax+1$. What is $P(-1)$ for every $a$?
  reponse: '0'
  explication:
    fr: '$-1-a+a+1=0$ : $-1$ est toujours une racine.'
    en: '$-1-a+a+1=0$: $-1$ is always a root.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 2, p. 254 ; engel-10-02 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-07
  type: numeric
  difficulte: 3
  enonce:
    fr: Pour quel réel $a$ la somme des carrés des racines de $x^2-(a-2)x-a-1$ est-elle minimale ?
    en: For which real $a$ is the sum of squares of the roots of $x^2-(a-2)x-a-1$ minimal?
  reponse: '1'
  explication:
    fr: Elle vaut $(a-1)^2+5$, minimum en $a=1$. Le discriminant $a^2+8$ est positif pour tout réel $a$.
    en: It equals $(a-1)^2+5$, minimized at $a=1$. The discriminant $a^2+8$ is positive for every real
      $a$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 17, p. 255 ; engel-10-17 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-08
  type: n-uplet
  difficulte: 3
  enonce:
    fr: Détermine $(a,b)$ pour que $(x-1)^2$ divise $ax^4+bx^3+1$.
    en: Find $(a,b)$ such that $(x-1)^2$ divides $ax^4+bx^3+1$.
  reponse:
  - 3
  - -4
  explication:
    fr: $a+b=-1$ et $4a+3b=0$. Soustraire trois fois la première équation donne $a=3$, puis $b=-4$.
    en: $a+b=-1$ and $4a+3b=0$. Subtract three times the first equation to get $a=3$, then $b=-4$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 23, p. 255 ; engel-10-23 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-09
  type: numeric
  difficulte: 3
  enonce:
    fr: Pour quelle valeur de $a$ la racine $-1$ de $x^5-ax^2-ax+1$ est-elle multiple ?
    en: For which $a$ is the root $-1$ of $x^5-ax^2-ax+1$ multiple?
  reponse: '-5'
  explication:
    fr: $P(-1)=0$ toujours ; $P'(-1)=5+2a-a=5+a$, donc $a=-5$.
    en: $P(-1)=0$ always; $P'(-1)=5+2a-a=5+a$, so $a=-5$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 3, p. 254 ; engel-10-03 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-10
  type: qcm
  difficulte: 4
  enonce:
    fr: Pose $s_n=r_1^n+r_2^n$ pour les racines de $x^2-6x+1$. Quelle récurrence vaut pour $n\ge2$ ?
    en: Put $s_n=r_1^n+r_2^n$ for the roots of $x^2-6x+1$. Which recurrence holds for $n\ge2$?
  bonnes:
  - 1
  explication:
    fr: Chaque racine vérifie $r^2=6r-1$. Multiplier par $r^{n-2}$ et additionner donne la deuxième relation,
      avec $s_0=2$, $s_1=6$.
    en: Each root satisfies $r^2=6r-1$. Multiply by $r^{n-2}$ and add to get the second relation, with
      $s_0=2$, $s_1=6$.
  choix:
  - fr: $s_n=6s_{n-1}+s_{n-2}$
    en: $s_n=6s_{n-1}+s_{n-2}$
  - fr: $s_n=6s_{n-1}-s_{n-2}$
    en: $s_n=6s_{n-1}-s_{n-2}$
  - fr: $s_n=s_{n-1}-6s_{n-2}$
    en: $s_n=s_{n-1}-6s_{n-2}$
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 26, p. 255 ; engel-10-26 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-11
  type: vrai-faux
  difficulte: 4
  enonce:
    fr: Un polynôme de degré au plus $2$ qui vaut $1$ en trois réels distincts vaut identiquement $1$.
    en: A polynomial of degree at most $2$ equal to $1$ at three distinct reals is identically $1$.
  reponse: true
  explication:
    fr: Soustrais $1$. Un polynôme non nul de degré au plus $2$ ne peut avoir trois racines distinctes.
    en: Subtract $1$. A nonzero polynomial of degree at most $2$ cannot have three distinct zeros.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 24, p. 255 ; engel-10-24 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-12
  type: qcm
  difficulte: 4
  enonce:
    fr: Une racine $u$ de $x^3+px^2+qx+r$ est la somme des deux autres. Que vaut $u$ ?
    en: One root $u$ of $x^3+px^2+qx+r$ equals the sum of the other two. What is $u$?
  bonnes:
  - 1
  explication:
    fr: La somme des trois racines vaut $-p$ mais aussi $2u$, donc $u=-p/2$.
    en: The sum of all three roots is both $-p$ and $2u$, hence $u=-p/2$.
  choix:
  - fr: $-p$
    en: $-p$
  - fr: $-p/2$
    en: $-p/2$
  - fr: $p/2$
    en: $p/2$
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 3, p. 254 ; engel-10-03 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-13
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Pour $s_n=r_1^n+r_2^n$ et $r_i$ racines de $x^2-6x+1$, on a $5\nmid s_n$ pour tout entier $n\ge0$.
    en: For $s_n=r_1^n+r_2^n$, where the $r_i$ are roots of $x^2-6x+1$, we have $5\nmid s_n$ for every
      integer $n\ge0$.
  reponse: true
  explication:
    fr: Modulo $5$, la récurrence devient $s_n=s_{n-1}-s_{n-2}$. Depuis $(s_0,s_1)=(2,1)$, les résidus
      sont $2,1,4,3,4,1$ puis la paire $(2,1)$ revient. Cette paire détermine toute la suite ; aucun résidu
      n’est nul.
    en: Modulo $5$, the recurrence is $s_n=s_{n-1}-s_{n-2}$. Starting at $(2,1)$, the residues are $2,1,4,3,4,1$,
      then the pair $(2,1)$ returns. The pair determines all later values; no residue is zero.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 24, p. 255 ; engel-10-24 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-14
  type: qcm
  difficulte: 5
  enonce:
    fr: Une racine de $x^3+px^2+qx+r$ est la somme des deux autres. Quelle relation est nécessaire ?
    en: One root of $x^3+px^2+qx+r$ equals the sum of the other two. Which relation is necessary?
  bonnes:
  - 0
  explication:
    fr: La racine vaut $-p/2$. La substitution donne $-p^3/8+p^3/4-pq/2+r=0$ ; multiplier par $8$ donne
      $p^3-4pq+8r=0$.
    en: The root is $-p/2$. Substitution gives $-p^3/8+p^3/4-pq/2+r=0$; multiply by $8$ to get $p^3-4pq+8r=0$.
  choix:
  - fr: $p^3-4pq+8r=0$
    en: $p^3-4pq+8r=0$
  - fr: $p^3-4pq-8r=0$
    en: $p^3-4pq-8r=0$
  - fr: $p^3+4pq+8r=0$
    en: $p^3+4pq+8r=0$
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 10 (Polynomials), problème 50, p. 256 ; engel-10-50 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: polynomes-racines-15
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Si $x^3+px^2+qx+r$ a trois racines réelles, alors $p^2\ge3q$, avec égalité exactement quand les
      trois racines sont égales.
    en: If $x^3+px^2+qx+r$ has three real roots, then $p^2\ge3q$, with equality exactly when all three
      roots coincide.
  reponse: true
  explication:
    fr: Viète donne $p^2-3q=\tfrac12[(u-v)^2+(v-w)^2+(w-u)^2]\ge0$. Une somme de carrés réels ne s’annule
      que si les trois différences sont nulles.
    en: Vieta gives $p^2-3q=\tfrac12[(u-v)^2+(v-w)^2+(w-u)^2]\ge0$. A sum of real squares vanishes exactly
      when all three differences vanish.
