id: geometrie-angles
theme: géométrie
niveau: 1
chapitre: 04-geometrie
titre:
  fr: Angles, triangles et cercles
  en: Angles, triangles and circles
fiche:
  fr: |
    - La somme des angles d'un triangle vaut $180^\circ$ ; celle d'un polygone convexe à $n \geq 3$ côtés vaut $(n-2) \times 180^\circ$.
    - **Angle inscrit** (sommet sur le cercle) : il vaut la moitié de l'angle au centre qui intercepte le même arc. Deux angles inscrits qui interceptent le même arc sont donc égaux.
    - **Pythagore** : dans un triangle rectangle, $a^2 + b^2 = c^2$ ($c$ hypoténuse, $a$ et $b$ les côtés de l'angle droit).
    - **Droite d'Euler** : dans un triangle non équilatéral, le centre de gravité $G$, l'orthocentre $H$ et le centre $O$ du cercle circonscrit sont alignés, avec $\vec{OH} = 3\vec{OG}$ (dans un triangle équilatéral, ils sont confondus).
  en: |
    - The angles of a triangle add up to $180^\circ$; those of a convex $n$-gon ($n \geq 3$) to $(n-2) \times 180^\circ$.
    - **Inscribed angle** (vertex on the circle): half the central angle subtending the same arc. So two inscribed angles subtending the same arc are equal.
    - **Pythagoras**: in a right triangle, $a^2 + b^2 = c^2$ ($c$ the hypotenuse, $a$ and $b$ the legs).
    - **Euler line**: in a non-equilateral triangle, the centroid $G$, orthocentre $H$ and circumcentre $O$ are collinear, with $\vec{OH} = 3\vec{OG}$ (in an equilateral triangle they coincide).
questions:
  - id: ga-01
    type: numeric
    difficulte: 1
    enonce:
      fr: "Un triangle a deux angles de $50^\\circ$ et $60^\\circ$. Combien mesure le troisième, en degrés ?"
      en: "A triangle has two angles of $50^\\circ$ and $60^\\circ$. How many degrees is the third?"
    reponse: "70"
    explication:
      fr: "$180 - 50 - 60 = 70$."
      en: "$180 - 50 - 60 = 70$."

  - id: ga-02
    type: numeric
    difficulte: 1
    enonce:
      fr: "Quelle est la somme des angles intérieurs d'un hexagone convexe, en degrés ?"
      en: "What is the sum of the interior angles of a convex hexagon, in degrees?"
    reponse: "720"
    explication:
      fr: "On découpe l'hexagone en $4$ triangles depuis un sommet : $(6 - 2) \\times 180 = 720$."
      en: "Cut the hexagon into $4$ triangles from one vertex: $(6 - 2) \\times 180 = 720$."

  - id: ga-03
    type: numeric
    difficulte: 1
    enonce:
      fr: "Un triangle rectangle a des côtés de l'angle droit de longueurs $5$ et $12$. Quelle est la longueur de l'hypoténuse ?"
      en: "A right triangle has legs of length $5$ and $12$. What is the length of the hypotenuse?"
    reponse: "13"
    explication:
      fr: "$5^2 + 12^2 = 25 + 144 = 169 = 13^2$."
      en: "$5^2 + 12^2 = 25 + 144 = 169 = 13^2$."

  - id: ga-04
    type: numeric
    difficulte: 2
    enonce:
      fr: "Sur un cercle de centre $O$, l'angle au centre $\\widehat{AOB}$ mesure $100^\\circ$. Combien mesure l'angle inscrit $\\widehat{AMB}$, où $M$ est sur le grand arc $AB$ ?"
      en: "On a circle with centre $O$, the central angle $\\widehat{AOB}$ is $100^\\circ$. What is the inscribed angle $\\widehat{AMB}$, with $M$ on the major arc $AB$?"
    reponse: "50"
    explication:
      fr: "L'angle inscrit vaut la moitié de l'angle au centre qui intercepte le même arc : $100 / 2 = 50$."
      en: "The inscribed angle is half the central angle subtending the same arc: $100 / 2 = 50$."

  - id: ga-05
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Dans tout triangle, le centre du cercle circonscrit est à l'intérieur du triangle."
      en: "In every triangle, the circumcentre lies inside the triangle."
    reponse: false
    explication:
      fr: "Il est à l'intérieur seulement si le triangle est acutangle ; il est au milieu de l'hypoténuse pour un triangle rectangle, et à l'extérieur pour un triangle obtusangle."
      en: "It is inside only for an acute triangle; at the midpoint of the hypotenuse for a right triangle, and outside for an obtuse triangle."

  - id: ga-06
    type: qcm
    difficulte: 2
    enonce:
      fr: "Quels points sont toujours sur la droite d'Euler d'un triangle non équilatéral ?"
      en: "Which points always lie on the Euler line of a non-equilateral triangle?"
    choix:
      - { fr: "Le centre de gravité", en: "The centroid" }
      - { fr: "L'orthocentre", en: "The orthocentre" }
      - { fr: "Le centre du cercle circonscrit", en: "The circumcentre" }
      - { fr: "Le centre du cercle inscrit", en: "The incentre" }
    bonnes: [0, 1, 2]
    explication:
      fr: "$G$, $H$ et $O$ sont alignés, avec $\\vec{OH} = 3\\vec{OG}$. Le centre du cercle inscrit n'y est que pour un triangle isocèle (voir la simulation « La droite d'Euler »)."
      en: "$G$, $H$ and $O$ are collinear, with $\\vec{OH} = 3\\vec{OG}$. The incentre lies on it only for an isosceles triangle (see the “Euler line” simulation)."

  - id: ga-07
    type: expression
    difficulte: 3
    enonce:
      fr: "Exprime l'aire d'un triangle équilatéral de côté $a$."
      en: "Express the area of an equilateral triangle with side $a$."
    reponse: "sqrt(3)/4*a^2"
    variables: [a]
    explication:
      fr: "La hauteur vaut $\\frac{\\sqrt 3}{2} a$ (Pythagore), donc l'aire vaut $\\frac12 \\cdot a \\cdot \\frac{\\sqrt3}{2} a = \\frac{\\sqrt3}{4} a^2$."
      en: "The height is $\\frac{\\sqrt 3}{2} a$ (Pythagoras), so the area is $\\frac12 \\cdot a \\cdot \\frac{\\sqrt3}{2} a = \\frac{\\sqrt3}{4} a^2$."

  - id: ga-08
    type: numeric
    difficulte: 1
    enonce:
      fr: "Quelle est la somme des angles intérieurs d'un pentagone convexe, en degrés ?"
      en: "What is the sum of the interior angles of a convex pentagon, in degrees?"
    reponse: "540"
    explication:
      fr: "$(5 - 2)\\times180 = 540$."
      en: "$(5 - 2)\\times180 = 540$."

  - id: ga-09
    type: numeric
    difficulte: 1
    enonce:
      fr: "Quelle est la mesure, en degrés, d'un angle intérieur d'un polygone régulier à $12$ côtés ?"
      en: "What is the measure, in degrees, of an interior angle of a regular $12$-gon?"
    reponse: "150"
    explication:
      fr: "La somme vaut $(12 - 2)\\times180 = 1800$, partagée en $12$ angles égaux : $150$."
      en: "The sum is $(12 - 2)\\times180 = 1800$, shared among $12$ equal angles: $150$."

  - id: ga-10
    type: numeric
    difficulte: 1
    enonce:
      fr: "Un triangle rectangle a des côtés de l'angle droit de longueurs $8$ et $15$. Quelle est la longueur de l'hypoténuse ?"
      en: "A right triangle has legs of lengths $8$ and $15$. What is the length of the hypotenuse?"
    reponse: "17"
    explication:
      fr: "$8^2 + 15^2 = 64 + 225 = 289 = 17^2$."
      en: "$8^2 + 15^2 = 64 + 225 = 289 = 17^2$."

  - id: ga-11
    type: numeric
    difficulte: 1
    enonce:
      fr: "Un triangle rectangle a une hypoténuse de longueur $15$ et un côté de l'angle droit de longueur $9$. Quelle est la longueur de l'autre côté ?"
      en: "A right triangle has hypotenuse $15$ and one leg $9$. What is the other leg?"
    reponse: "12"
    explication:
      fr: "$15^2 - 9^2 = 225 - 81 = 144 = 12^2$."
      en: "$15^2 - 9^2 = 225 - 81 = 144 = 12^2$."

  - id: ga-12
    type: numeric
    difficulte: 1
    enonce:
      fr: "Quelle est la longueur de la diagonale d'un rectangle de côtés $6$ et $8$ ?"
      en: "What is the length of the diagonal of a $6 \\times 8$ rectangle?"
    reponse: "10"
    explication:
      fr: "Pythagore : $\\sqrt{6^2 + 8^2} = \\sqrt{100} = 10$."
      en: "Pythagoras: $\\sqrt{6^2 + 8^2} = \\sqrt{100} = 10$."

  - id: ga-13
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quelle est l'aire d'un triangle de côtés $13$, $14$ et $15$ ?"
      en: "What is the area of a triangle with sides $13$, $14$ and $15$?"
    reponse: "84"
    explication:
      fr: "Formule de Héron avec $s = 21$ : $\\sqrt{21\\cdot8\\cdot7\\cdot6} = \\sqrt{7056} = 84$."
      en: "Heron's formula with $s = 21$: $\\sqrt{21\\cdot8\\cdot7\\cdot6} = \\sqrt{7056} = 84$."

  - id: ga-14
    type: numeric
    difficulte: 1
    enonce:
      fr: "Quelle est l'aire d'un triangle rectangle dont les côtés de l'angle droit mesurent $5$ et $12$ ?"
      en: "What is the area of a right triangle whose legs measure $5$ and $12$?"
    reponse: "30"
    explication:
      fr: "$\\frac12\\times5\\times12 = 30$."
      en: "$\\frac12\\times5\\times12 = 30$."

  - id: ga-15
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Tout angle inscrit dans un cercle qui intercepte un diamètre est un angle droit."
      en: "Every angle inscribed in a circle that subtends a diameter is a right angle."
    reponse: true
    explication:
      fr: "L'angle au centre vaut $180^\\circ$, donc l'angle inscrit vaut la moitié : $90^\\circ$ (théorème de Thalès)."
      en: "The central angle is $180^\\circ$, so the inscribed angle is half of it: $90^\\circ$ (Thales' theorem)."

  - id: ga-16
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Dans tout triangle, les trois médianes sont concourantes."
      en: "In every triangle, the three medians are concurrent."
    reponse: true
    explication:
      fr: "Elles se coupent au centre de gravité $G$, situé aux deux tiers de chaque médiane à partir du sommet."
      en: "They meet at the centroid $G$, located two thirds along each median from the vertex."

  - id: ga-17
    type: numeric
    difficulte: 1
    enonce:
      fr: "Un triangle isocèle a un angle au sommet principal de $40^\\circ$. Combien mesure chaque angle à la base, en degrés ?"
      en: "An isosceles triangle has an apex angle of $40^\\circ$. How large is each base angle, in degrees?"
    reponse: "70"
    explication:
      fr: "$(180 - 40)/2 = 70$."
      en: "$(180 - 40)/2 = 70$."

  - id: ga-18
    type: numeric
    difficulte: 2
    enonce:
      fr: "Un triangle rectangle a des côtés de longueurs $6$, $8$ et $10$. Quel est le rayon de son cercle circonscrit ?"
      en: "A right triangle has sides $6$, $8$ and $10$. What is the radius of its circumscribed circle?"
    reponse: "5"
    explication:
      fr: "Le centre du cercle circonscrit est le milieu de l'hypoténuse : le rayon vaut la moitié de l'hypoténuse, soit $5$."
      en: "The circumcentre is the midpoint of the hypotenuse: the radius is half the hypotenuse, i.e. $5$."

  - id: ga-19
    type: numeric
    difficulte: 3
    enonce:
      fr: "Un triangle rectangle a des côtés de longueurs $3$, $4$ et $5$. Quel est le rayon de son cercle inscrit ?"
      en: "A right triangle has sides $3$, $4$ and $5$. What is the radius of its inscribed circle?"
    reponse: "1"
    explication:
      fr: "Aire $= 6$, demi-périmètre $s = 6$, et $r = \\frac{\\text{aire}}{s} = 1$. (Pour un triangle rectangle, $r = \\frac{a + b - c}{2} = 1$.)"
      en: "Area $= 6$, semi-perimeter $s = 6$, and $r = \\frac{\\text{area}}{s} = 1$. (For a right triangle, $r = \\frac{a + b - c}{2} = 1$.)"

  - id: ga-20
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Les diagonales d'un parallélogramme se coupent en leur milieu."
      en: "The diagonals of a parallelogram bisect each other."
    reponse: true
    explication:
      fr: "C'est une propriété caractéristique du parallélogramme."
      en: "This is a characteristic property of the parallelogram."

  - id: ga-21
    type: numeric
    difficulte: 2
    enonce:
      fr: "Un quadrilatère $ABCD$ est inscrit dans un cercle. L'angle en $A$ mesure $110^\\circ$. Combien mesure l'angle en $C$, en degrés ?"
      en: "A quadrilateral $ABCD$ is inscribed in a circle. The angle at $A$ measures $110^\\circ$. How large is the angle at $C$, in degrees?"
    reponse: "70"
    explication:
      fr: "Dans un quadrilatère inscrit, les angles opposés sont supplémentaires : $180 - 110 = 70$."
      en: "In a cyclic quadrilateral, opposite angles are supplementary: $180 - 110 = 70$."

  - id: ga-22
    type: numeric
    difficulte: 1
    enonce:
      fr: "Combien l'octogone convexe a-t-il de diagonales ?"
      en: "How many diagonals does a convex octagon have?"
    reponse: "20"
    explication:
      fr: "$\\binom82 - 8 = 28 - 8 = 20$ (segments entre sommets, moins les côtés)."
      en: "$\\binom82 - 8 = 28 - 8 = 20$ (segments between vertices, minus the sides)."

  - id: ga-23
    type: numeric
    difficulte: 2
    enonce:
      fr: "Dans le triangle $ABC$, $D \\in [AB]$ et $E \\in [AC]$ avec $(DE) \\parallel (BC)$. On a $AD = 3$, $DB = 2$ et $AE = 4{,}5$. Quelle est la longueur $EC$ ?"
      en: "In triangle $ABC$, $D \\in [AB]$ and $E \\in [AC]$ with $(DE) \\parallel (BC)$. We have $AD = 3$, $DB = 2$ and $AE = 4.5$. What is $EC$?"
    reponse: "3"
    explication:
      fr: "Thalès : $\\frac{AD}{DB} = \\frac{AE}{EC}$, donc $EC = \\frac{2\\times4{,}5}{3} = 3$."
      en: "Thales: $\\frac{AD}{DB} = \\frac{AE}{EC}$, so $EC = \\frac{2\\times4.5}{3} = 3$."

  - id: ga-24
    type: numeric
    difficulte: 2
    enonce:
      fr: "Un triangle isocèle a pour côtés $5$, $5$ et $6$ (base $6$). Quelle est la hauteur issue du sommet opposé à la base ?"
      en: "An isosceles triangle has sides $5$, $5$ and $6$ (base $6$). What is the altitude from the apex?"
    reponse: "4"
    explication:
      fr: "Le pied de la hauteur est le milieu de la base : $h^2 = 5^2 - 3^2 = 16$, donc $h = 4$."
      en: "The foot of the altitude is the midpoint of the base: $h^2 = 5^2 - 3^2 = 16$, so $h = 4$."

  - id: ga-25
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quelle est la mesure, en degrés, du plus petit angle entre les aiguilles d'une horloge à $2$ h $30$ ?"
      en: "What is the smaller angle, in degrees, between the clock hands at 2:30?"
    reponse: "105"
    explication:
      fr: "L'aiguille des minutes est à $180^\\circ$ (sur le 6) ; celle des heures est à $2{,}5\\times30 = 75^\\circ$. Écart : $105^\\circ$."
      en: "The minute hand is at $180^\\circ$ (on the 6); the hour hand is at $2.5\\times30 = 75^\\circ$. Difference: $105^\\circ$."

  - id: ga-26
    type: numeric
    difficulte: 2
    enonce:
      fr: "Quel polygone régulier a des angles intérieurs de $140^\\circ$ ? Donne son nombre de côtés."
      en: "Which regular polygon has interior angles of $140^\\circ$? Give its number of sides."
    reponse: "9"
    explication:
      fr: "L'angle extérieur vaut $180 - 140 = 40$ et $360/40 = 9$ : c'est l'ennéagone."
      en: "The exterior angle is $180 - 140 = 40$ and $360/40 = 9$: it is the nonagon."
