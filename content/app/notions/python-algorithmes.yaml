      en: "Write the function `recherche(l, x)` that, for a **sorted** list `l` of **distinct** integers, returns the position of `x` in `l`, or $-1$ if `x` is not in it. Use binary search."
    squelette:
      fr: |
        def recherche(l, x):
            g = 0
            d = len(l) - 1
            while g <= d:
                m = (g + d) // 2
                # à compléter
            return -1
      en: |
        def recherche(l, x):
            g = 0
            d = len(l) - 1
            while g <= d:
                m = (g + d) // 2
                # to complete
            return -1
    tests:
      - { entree: [[1, 3, 5, 7, 9], 7], sortie: 3 }
      - { entree: [[1, 3, 5, 7, 9], 4], sortie: -1 }
    tests_caches:
      - { entree: [[], 1], sortie: -1 }
      - { entree: [[5], 5], sortie: 0 }
      - { entree: [[2, 4, 6, 8, 10, 12], 2], sortie: 0 }
      - { entree: [[2, 4, 6, 8, 10, 12], 12], sortie: 5 }
      - { entree: [[2, 4, 6, 8, 10, 12], 13], sortie: -1 }
    reference: |
      def recherche(l, x):
          g = 0
          d = len(l) - 1
          while g <= d:
              m = (g + d) // 2
              if l[m] == x:
                  return m
              if l[m] < x:
                  g = m + 1
              else:
                  d = m - 1
          return -1
    explication:
      fr: "La zone utile est `l[g..d]`. Si `l[m] < x`, `x` ne peut être qu'à droite : `g = m + 1` ; sinon à gauche : `d = m - 1`. Le `+ 1` et le `- 1` garantissent que la zone rétrécit : sans eux, la boucle peut tourner sans fin."
      en: "The useful zone is `l[g..d]`. If `l[m] < x`, `x` can only be on the right: `g = m + 1`; otherwise on the left: `d = m - 1`. The `+ 1` and `- 1` make sure the zone shrinks: without them, the loop may run forever."

