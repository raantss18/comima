    reference: |
      def plus_longue_serie(l):
          if len(l) == 0:
              return 0
          meilleur = 1
          courant = 1
          for i in range(1, len(l)):
              if l[i] == l[i - 1]:
                  courant += 1
              else:
                  courant = 1
              if courant > meilleur:
                  meilleur = courant
          return meilleur
