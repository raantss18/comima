      en: "Write the function `crible(n)` that returns the increasing list of primes less than or equal to $n$ (sieve of Eratosthenes), for $n \\ge 0$."
    squelette:
      fr: |
        def crible(n):
            if n < 2:
                return []
            premier = [True] * (n + 1)
