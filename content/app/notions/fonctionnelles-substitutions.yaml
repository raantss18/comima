id: fonctionnelles-substitutions
theme: algèbre
niveau: 4
titre:
  fr: Substitutions, parité et orbites
  en: Substitution, parity and orbits
fiche:
  fr: 'Une équation fonctionnelle doit être vraie pour toutes les valeurs de son domaine. Essaie $x=0$,
    $y=0$, $y=x$, puis $x\mapsto-x$ : ces choix révèlent $f(0)$ et la parité. Une fonction est paire si
    $f(-x)=f(x)$, impaire si $f(-x)=-f(x)$.


    Pour $T(x)=1/(1-x)$ sur $\mathbb R\setminus\{0,1\}$, calcule les itérées : $T^2(x)=(x-1)/x$, $T^3(x)=x$.
    Écrire la même équation aux trois points donne un système linéaire.


    Ne suppose pas la continuité : $f(x)=f(x/2)$ ne force pas à elle seule une fonction constante. Si
    la continuité en zéro est donnée, on peut passer à la limite le long de $x/2^n$.'
  en: 'A functional equation holds for every argument in its domain. Try $x=0$, $y=0$, $y=x$, then $x\mapsto-x$
    to reveal $f(0)$ and parity. A function is even if $f(-x)=f(x)$ and odd if $f(-x)=-f(x)$.


    For $T(x)=1/(1-x)$ on $\mathbb R\setminus\{0,1\}$, compute iterates: $T^2(x)=(x-1)/x$, $T^3(x)=x$.
    Write the equation at all three points to get a linear system.


    Do not assume continuity: $f(x)=f(x/2)$ alone does not force constancy. If continuity at zero is given,
    pass to the limit along $x/2^n$.'
questions:
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 10, p. 278 ; engel-11-10 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-01
  type: numeric
  difficulte: 1
  enonce:
    fr: $f(x+y)+f(x-y)=2[f(x)+f(y)]$ sur $\mathbb R$. Que vaut $f(0)$ ?
    en: $f(x+y)+f(x-y)=2[f(x)+f(y)]$ on $\mathbb R$. What is $f(0)$?
  reponse: '0'
  explication:
    fr: 'Prends $x=y=0$ : $2f(0)=4f(0)$.'
    en: 'Set $x=y=0$: $2f(0)=4f(0)$.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 11, p. 278 ; engel-11-11 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-02
  type: numeric
  difficulte: 1
  enonce:
    fr: $f(x+y)-f(x-y)=2f(y)$ sur $\mathbb R$. Que vaut $f(0)$ ?
    en: $f(x+y)-f(x-y)=2f(y)$ on $\mathbb R$. What is $f(0)$?
  reponse: '0'
  explication:
    fr: Pour $y=0$, $0=2f(0)$.
    en: For $y=0$, $0=2f(0)$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 15, p. 278 ; engel-11-15 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-03
  type: numeric
  difficulte: 1
  enonce:
    fr: Pour $T(x)=1/(1-x)$, calcule $T(2)$.
    en: For $T(x)=1/(1-x)$, compute $T(2)$.
  reponse: '-1'
  explication:
    fr: $1/(1-2)=-1$.
    en: $1/(1-2)=-1$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 10, p. 278 ; engel-11-10 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-04
  type: vrai-faux
  difficulte: 2
  enonce:
    fr: Toute solution réelle de $f(x+y)+f(x-y)=2[f(x)+f(y)]$ est paire.
    en: Every real solution of $f(x+y)+f(x-y)=2[f(x)+f(y)]$ is even.
  reponse: true
  explication:
    fr: On sait $f(0)=0$. En $x=0$, $f(y)+f(-y)=2f(y)$, donc $f(-y)=f(y)$.
    en: 'We have $f(0)=0$. Set $x=0$: $f(y)+f(-y)=2f(y)$, so $f(-y)=f(y)$.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 11, p. 278 ; engel-11-11 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-05
  type: vrai-faux
  difficulte: 2
  enonce:
    fr: Toute solution réelle de $f(x+y)-f(x-y)=2f(y)$ est impaire.
    en: Every real solution of $f(x+y)-f(x-y)=2f(y)$ is odd.
  reponse: true
  explication:
    fr: En $x=0$, $f(y)-f(-y)=2f(y)$, d’où $f(-y)=-f(y)$.
    en: At $x=0$, $f(y)-f(-y)=2f(y)$, giving $f(-y)=-f(y)$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 15, p. 278 ; engel-11-15 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-06
  type: expression
  difficulte: 2
  enonce:
    fr: Pour $T(x)=1/(1-x)$, exprime $T(T(x))$ sur $\mathbb R\setminus\{0,1\}$.
    en: For $T(x)=1/(1-x)$, express $T(T(x))$ on $\mathbb R\setminus\{0,1\}$.
  reponse: (x-1)/x
  explication:
    fr: $1/(1-1/(1-x))=(x-1)/x$.
    en: $1/(1-1/(1-x))=(x-1)/x$.
  variables:
  - x
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 7, p. 278 ; engel-11-07 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-07
  type: numeric
  difficulte: 3
  enonce:
    fr: $f:\mathbb R\to\mathbb R$ n’est pas identiquement nulle et vérifie $f(x)f(y)=f(x-y)$. Trouve $f(0)$.
    en: $f:\mathbb R\to\mathbb R$ is not identically zero and satisfies $f(x)f(y)=f(x-y)$. Find $f(0)$.
  reponse: '1'
  explication:
    fr: 'Choisis $t$ tel que $f(t)\ne0$ et prends $(x,y)=(t,0)$ : $f(t)f(0)=f(t)$, donc $f(0)=1$.'
    en: 'Choose $t$ with $f(t)\ne0$ and use $(x,y)=(t,0)$: $f(t)f(0)=f(t)$, hence $f(0)=1$.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 10, p. 278 ; engel-11-10 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-08
  type: expression
  difficulte: 3
  enonce:
    fr: Si $f$ vérifie $f(x+y)+f(x-y)=2[f(x)+f(y)]$, exprime $f(2x)$ en fonction de $u=f(x)$.
    en: If $f$ satisfies $f(x+y)+f(x-y)=2[f(x)+f(y)]$, express $f(2x)$ in terms of $u=f(x)$.
  reponse: 4*u
  explication:
    fr: $f(0)=0$ et $y=x$ donnent $f(2x)=4f(x)$.
    en: $f(0)=0$ and $y=x$ give $f(2x)=4f(x)$.
  variables:
  - u
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 15, p. 278 ; engel-11-15 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-09
  type: numeric
  difficulte: 3
  enonce:
    fr: Si $f(x)+f(1/(1-x))=x$ pour $x\ne0,1$, trouve $f(2)$.
    en: If $f(x)+f(1/(1-x))=x$ for $x\ne0,1$, find $f(2)$.
  reponse: 7/4
  explication:
    fr: L’orbite est $2,-1,1/2$. Les équations $A+B=2$, $B+C=-1$, $C+A=1/2$ donnent $2A=7/2$, donc $A=7/4$.
    en: The orbit is $2,-1,1/2$. Equations $A+B=2$, $B+C=-1$, $C+A=1/2$ give $2A=7/2$, hence $A=7/4$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 1, p. 277 ; engel-11-01 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-10
  type: vrai-faux
  difficulte: 4
  enonce:
    fr: Si $f(x)=f(x/2)$ sur $\mathbb R$ et $f$ est continue en $0$, alors $f$ est constante.
    en: If $f(x)=f(x/2)$ on $\mathbb R$ and $f$ is continuous at $0$, then $f$ is constant.
  reponse: true
  explication:
    fr: Pour tout $n$, $f(x)=f(x/2^n)$. L’argument tend vers $0$ ; la continuité en ce seul point donne
      $f(x)=f(0)$.
    en: For every $n$, $f(x)=f(x/2^n)$. The argument tends to zero; continuity at that one point gives
      $f(x)=f(0)$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 7, p. 278 ; engel-11-07 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-11
  type: numeric
  difficulte: 4
  enonce:
    fr: Sous les hypothèses $f(x)f(y)=f(x-y)$ et $f\not\equiv0$, combien vaut $f(5)$ ?
    en: Under $f(x)f(y)=f(x-y)$ and $f\not\equiv0$, what is $f(5)$?
  reponse: '1'
  explication:
    fr: 'On a $f(0)=1$, puis $f(t)^2=1$. En $x=2t,y=t$, $f(2t)f(t)=f(t)$ donc $f(2t)=1$. Tout réel est
      un double : $f\equiv1$.'
    en: We have $f(0)=1$, then $f(t)^2=1$. At $x=2t,y=t$, $f(2t)f(t)=f(t)$, hence $f(2t)=1$. Every real
      is twice a real, so $f\equiv1$.
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 12, p. 278 ; engel-11-12 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-12
  type: expression
  difficulte: 4
  enonce:
    fr: $f(x+y)+f(x-y)=2f(x)$ et $f(0)=c$. En posant $g(x)=f(x)-c$, exprime $g(2x)$ en fonction de $u=g(x)$.
    en: $f(x+y)+f(x-y)=2f(x)$ and $f(0)=c$. Set $g(x)=f(x)-c$. Express $g(2x)$ in terms of $u=g(x)$.
  reponse: 2*u
  explication:
    fr: $g$ vérifie la même équation et $g(0)=0$. Avec $y=x$, $g(2x)=2g(x)$.
    en: $g$ satisfies the same equation with $g(0)=0$. Taking $y=x$ gives $g(2x)=2g(x)$.
  variables:
  - u
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 1, p. 277 ; engel-11-01 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-13
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Sans continuité, $f(x)=f(x/2)$ impose encore que $f$ soit constante sur $\mathbb R$.
    en: Without continuity, $f(x)=f(x/2)$ still forces $f$ to be constant on $\mathbb R$.
  reponse: false
  explication:
    fr: 'Contre-exemple : $f(x)=1$ si $x>0$, $0$ sinon. Diviser par $2$ préserve le signe, donc l’équation
      est vraie, mais la fonction n’est pas constante.'
    en: 'Counterexample: $f(x)=1$ for $x>0$, and $0$ otherwise. Halving preserves sign, so the equation
      holds although the function is not constant.'
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 15, p. 278 ; engel-11-15 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-14
  type: expression
  difficulte: 5
  enonce:
    fr: 'Résous $f(x)+f(1/(1-x))=x$ sur $\mathbb R\setminus\{0,1\}$ : donne $f(x)$.'
    en: 'Solve $f(x)+f(1/(1-x))=x$ on $\mathbb R\setminus\{0,1\}$: give $f(x)$.'
  reponse: (x-1/(1-x)+(x-1)/x)/2
  explication:
    fr: Les trois équations d’orbite sont $A+B=x$, $B+C=T(x)$, $C+A=T^2(x)$. Leur combinaison donne $2A=x-T(x)+T^2(x)$.
      Substituer cette formule vérifie l’équation initiale.
    en: The orbit equations are $A+B=x$, $B+C=T(x)$, $C+A=T^2(x)$. Combine them to get $2A=x-T(x)+T^2(x)$.
      Substitution verifies the original equation.
  variables:
  - x
# Source : Arthur Engel, Problem-Solving Strategies (Springer, Problem Books in Mathematics, 1998), chapitre 11 (Functional Equations), problème 12, p. 278 ; engel-11-12 ; sous-question pédagogique, traduction/adaptation FR/EN, correction originale COMIMa.
- id: fonctionnelles-substitutions-15
  type: vrai-faux
  difficulte: 5
  enonce:
    fr: Toute solution de $f(x+y)+f(x-y)=2f(x)$ a la forme $f(x)=A(x)+c$, avec $A(x+y)=A(x)+A(y)$, même
      sans continuité.
    en: Every solution of $f(x+y)+f(x-y)=2f(x)$ has the form $f(x)=A(x)+c$ with $A(x+y)=A(x)+A(y)$, even
      without continuity.
  reponse: true
  explication:
    fr: Pose $A=f-f(0)$. Alors $A(2t)=2A(t)$. Utilise $x=(u+v)/2$, $y=(u-v)/2$ pour obtenir $A(u)+A(v)=2A((u+v)/2)=A(u+v)$.
      La réciproque se vérifie par substitution.
    en: Put $A=f-f(0)$. Then $A(2t)=2A(t)$. Use $x=(u+v)/2$, $y=(u-v)/2$ to get $A(u)+A(v)=2A((u+v)/2)=A(u+v)$.
      Conversely, substitution verifies every such function.
