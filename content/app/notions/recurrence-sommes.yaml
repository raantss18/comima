id: recurrence-sommes
theme: algèbre
niveau: 2
chapitre: 01-recurrence
titre:
  fr: Sommes et récurrence
  en: Sums and induction
fiche:
  fr: |
    Pour démontrer qu'une propriété $P(n)$ (qui dépend d'un entier $n$) est vraie pour tout entier $n \ge 1$ :

    1. **Initialisation** : on vérifie que $P(1)$ est vraie.
    2. **Hérédité** : on suppose que $P(n)$ est vraie pour un entier $n \ge 1$ quelconque et on en déduit que $P(n+1)$ est vraie.

    On conclut que $P(n)$ est vraie pour tout entier $n \ge 1$. Les deux étapes sont nécessaires. Ici, $1 + 2 + \dots + n$ désigne la somme des entiers de $1$ à $n$.

    Exemple clé : $1 + 2 + \dots + n = \dfrac{n(n+1)}{2}$.
  en: |
    To prove that a statement $P(n)$ (depending on an integer $n$) holds for every integer $n \ge 1$:

    1. **Base case**: check that $P(1)$ is true.
    2. **Inductive step**: assume that $P(n)$ is true for an arbitrary integer $n \ge 1$ and deduce that $P(n+1)$ is true.

    We conclude that $P(n)$ holds for every integer $n \ge 1$. Both steps are necessary. Here $1 + 2 + \dots + n$ is the sum of the integers from $1$ to $n$.

    Key example: $1 + 2 + \dots + n = \dfrac{n(n+1)}{2}$.
questions:
  - id: rs-01
    type: numeric
    difficulte: 1
    enonce:
      fr: "Combien vaut $1 + 2 + 3 + \\dots + 10$ ?"
      en: "What is $1 + 2 + 3 + \\dots + 10$?"
    reponse: "55"
    explication:
      fr: "On regroupe $1 + 10$, $2 + 9$, … : cinq paires de somme $11$, donc $55$."
      en: "Pair $1 + 10$, $2 + 9$, …: five pairs adding to $11$, hence $55$."

  - id: rs-02
    type: expression
    difficulte: 2
    enonce:
      fr: "Donne une expression de $S_n = 1 + 2 + \\dots + n$ en fonction de $n$."
      en: "Give an expression for $S_n = 1 + 2 + \\dots + n$ in terms of $n$."
    reponse: "n*(n+1)/2"
    variables: [n]
    explication:
      fr: "En écrivant la somme à l'endroit et à l'envers : $2S_n = n(n+1)$. Toute forme équivalente est acceptée, par exemple $\\frac{n^2+n}{2}$."
      en: "Write the sum forwards and backwards: $2S_n = n(n+1)$. Any equivalent form is accepted, e.g. $\\frac{n^2+n}{2}$."

  - id: rs-03
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour une récurrence, il suffit de prouver l'hérédité ; l'initialisation est facultative."
      en: "For an induction, proving the inductive step is enough; the base case is optional."
    reponse: false
    explication:
      fr: "Sans initialisation, on peut « prouver » des absurdités : $n = n + 1 \\Rightarrow n + 1 = n + 2$ est héréditaire mais jamais vrai."
      en: "Without a base case one can “prove” nonsense: $n = n + 1 \\Rightarrow n + 1 = n + 2$ is hereditary but never true."

  - id: rs-04
    type: qcm
    difficulte: 2
    enonce:
      fr: "Quelles égalités sont vraies pour tout $n \\ge 1$ ? (plusieurs réponses possibles)"
      en: "Which identities hold for every $n \\ge 1$? (several answers possible)"
    choix:
      - { fr: "$1 + 3 + \\dots + (2n-1) = n^2$", en: "$1 + 3 + \\dots + (2n-1) = n^2$" }
      - { fr: "$1 + 3 + \\dots + (2n-1) = 2n^2 - 1$", en: "$1 + 3 + \\dots + (2n-1) = 2n^2 - 1$" }
      - { fr: "$2 + 4 + \\dots + 2n = n^2$", en: "$2 + 4 + \\dots + 2n = n^2$" }
      - { fr: "$2 + 4 + \\dots + 2n = n(n+1)$", en: "$2 + 4 + \\dots + 2n = n(n+1)$" }
    bonnes: [0, 3]
    explication:
      fr: "Somme des $n$ premiers impairs : $n^2$ ; somme des $n$ premiers pairs : $2 \\cdot \\frac{n(n+1)}{2} = n(n+1)$."
      en: "Sum of the first $n$ odd numbers: $n^2$; of the first $n$ even numbers: $2 \\cdot \\frac{n(n+1)}{2} = n(n+1)$."

  - id: rs-05
    type: ordre
    difficulte: 3
    enonce:
      fr: "Remets dans l'ordre la preuve par récurrence de $P(n) : 1 + 2 + \\dots + n = \\frac{n(n+1)}{2}$, et écarte l'étape fausse."
      en: "Put back in order the proof by induction of $P(n) : 1 + 2 + \\dots + n = \\frac{n(n+1)}{2}$, and discard the wrong step."
    etapes:
      - { fr: "Pour $n = 1$ : $1 = \\frac{1 \\cdot 2}{2}$, donc $P(1)$ est vraie.", en: "For $n = 1$: $1 = \\frac{1 \\cdot 2}{2}$, so $P(1)$ holds." }
      - { fr: "Supposons $1 + \\dots + n = \\frac{n(n+1)}{2}$ pour un $n \\ge 1$ fixé.", en: "Assume $1 + \\dots + n = \\frac{n(n+1)}{2}$ for some fixed $n \\ge 1$." }
      - { fr: "Alors $1 + \\dots + n + (n+1) = \\frac{n(n+1)}{2} + (n+1)$.", en: "Then $1 + \\dots + n + (n+1) = \\frac{n(n+1)}{2} + (n+1)$." }
      - { fr: "Et $\\frac{n(n+1)}{2} + (n+1) = \\frac{(n+1)(n+2)}{2}$ : c'est $P(n+1)$.", en: "And $\\frac{n(n+1)}{2} + (n+1) = \\frac{(n+1)(n+2)}{2}$: this is $P(n+1)$." }
      - { fr: "Par récurrence, $P(n)$ est vraie pour tout $n \\ge 1$.", en: "By induction, $P(n)$ holds for every $n \\ge 1$." }
    dependances: [[1, 2], [2, 3], [0, 4], [3, 4]]
    intrus:
      - { fr: "Supposons $P(n)$ vraie pour tout $n$.", en: "Assume $P(n)$ holds for every $n$." }
    explication:
      fr: "L'initialisation peut être écrite avant ou après l'hérédité ; en revanche, supposer $P(n)$ « pour tout $n$ » revient à supposer ce qu'on veut prouver."
      en: "The base case may come before or after the inductive step; but assuming $P(n)$ “for every $n$” assumes what we want to prove."

  - id: rs-06
    type: trous
    difficulte: 3
    enonce:
      fr: "Complète l'hérédité pour $1 + 3 + \\dots + (2n-1) = n^2$ (somme des $n$ premiers impairs)."
      en: "Complete the inductive step for $1 + 3 + \\dots + (2n-1) = n^2$ (sum of the first $n$ odd numbers)."
    texte:
      fr: "On suppose la somme égale à $n^2$. Le terme suivant est {{1}}, donc la nouvelle somme vaut $n^2 + $ {{1}} $=$ {{2}}."
      en: "Assume the sum equals $n^2$. The next term is {{1}}, so the new sum is $n^2 + $ {{1}} $=$ {{2}}."
    trous:
      - { type: expression, reponse: "2*n+1", variables: [n] }
      - { type: expression, reponse: "(n+1)^2", variables: [n] }
    explication:
      fr: "Le $(n+1)$-ième impair est $2(n+1) - 1 = 2n + 1$ et $n^2 + 2n + 1 = (n+1)^2$."
      en: "The $(n+1)$-th odd number is $2(n+1) - 1 = 2n + 1$ and $n^2 + 2n + 1 = (n+1)^2$."

  - id: rs-07
    type: numeric
    difficulte: 1
    enonce:
      fr: "Combien vaut $1 + 2 + 3 + \\dots + 100$ ?"
      en: "What is $1 + 2 + 3 + \\dots + 100$?"
    reponse: "5050"
    explication:
      fr: "$\\frac{100\\times101}{2} = 5050$."
      en: "$\\frac{100\\times101}{2} = 5050$."

  - id: rs-08
    type: numeric
    difficulte: 1
    enonce:
      fr: "Combien vaut $1^2 + 2^2 + 3^2 + 4^2 + 5^2$ ?"
      en: "What is $1^2 + 2^2 + 3^2 + 4^2 + 5^2$?"
    reponse: "55"
    explication:
      fr: "$1 + 4 + 9 + 16 + 25 = 55$. On a aussi $\\frac{n(n+1)(2n+1)}{6} = \\frac{5\\cdot6\\cdot11}{6} = 55$."
      en: "$1 + 4 + 9 + 16 + 25 = 55$. Also $\\frac{n(n+1)(2n+1)}{6} = \\frac{5\\cdot6\\cdot11}{6} = 55$."

  - id: rs-09
    type: numeric
    difficulte: 2
    enonce:
      fr: "Combien vaut $1^2 + 2^2 + \\dots + 20^2$ ?"
      en: "What is $1^2 + 2^2 + \\dots + 20^2$?"
    reponse: "2870"
    explication:
      fr: "$\\frac{20\\cdot21\\cdot41}{6} = 2870$."
      en: "$\\frac{20\\cdot21\\cdot41}{6} = 2870$."

  - id: rs-10
    type: numeric
    difficulte: 2
    enonce:
      fr: "Combien vaut $1^3 + 2^3 + \\dots + 10^3$ ?"
      en: "What is $1^3 + 2^3 + \\dots + 10^3$?"
    reponse: "3025"
    explication:
      fr: "La somme des cubes est le carré de la somme : $\\left(\\frac{10\\cdot11}{2}\\right)^2 = 55^2 = 3025$."
      en: "The sum of cubes is the square of the sum: $\\left(\\frac{10\\cdot11}{2}\\right)^2 = 55^2 = 3025$."

  - id: rs-11
    type: expression
    difficulte: 2
    enonce:
      fr: "Donne une expression de $1^3 + 2^3 + \\dots + n^3$ en fonction de $n$."
      en: "Give an expression for $1^3 + 2^3 + \\dots + n^3$ in terms of $n$."
    reponse: "(n*(n+1)/2)^2"
    variables: [n]
    explication:
      fr: "Pour tout $n \\ge 1$, $1^3 + \\dots + n^3 = \\left(\\frac{n(n+1)}{2}\\right)^2$ (par récurrence : $\\left(\\frac{n(n+1)}{2}\\right)^2 + (n+1)^3 = \\left(\\frac{(n+1)(n+2)}{2}\\right)^2$)."
      en: "For all $n \\ge 1$, $1^3 + \\dots + n^3 = \\left(\\frac{n(n+1)}{2}\\right)^2$ (by induction: $\\left(\\frac{n(n+1)}{2}\\right)^2 + (n+1)^3 = \\left(\\frac{(n+1)(n+2)}{2}\\right)^2$)."

  - id: rs-12
    type: expression
    difficulte: 2
    enonce:
      fr: "Donne une expression de $2 + 4 + 6 + \\dots + 2n$ en fonction de $n$."
      en: "Give an expression for $2 + 4 + 6 + \\dots + 2n$ in terms of $n$."
    reponse: "n*(n+1)"
    variables: [n]
    explication:
      fr: "$2(1 + 2 + \\dots + n) = n(n+1)$."
      en: "$2(1 + 2 + \\dots + n) = n(n+1)$."

  - id: rs-13
    type: expression
    difficulte: 2
    enonce:
      fr: "Donne une expression de $1 + 2 + 4 + 8 + \\dots + 2^n$ en fonction de $n$."
      en: "Give an expression for $1 + 2 + 4 + 8 + \\dots + 2^n$ in terms of $n$."
    reponse: "2^(n+1)-1"
    variables: [n]
    explication:
      fr: "Somme géométrique de raison $2$ : $\\frac{2^{n+1} - 1}{2 - 1} = 2^{n+1} - 1$."
      en: "Geometric sum with ratio $2$: $\\frac{2^{n+1} - 1}{2 - 1} = 2^{n+1} - 1$."

  - id: rs-14
    type: numeric
    difficulte: 1
    enonce:
      fr: "Combien vaut $1 + 3 + 9 + 27 + 81$ ?"
      en: "What is $1 + 3 + 9 + 27 + 81$?"
    reponse: "121"
    explication:
      fr: "Somme géométrique : $\\frac{3^5 - 1}{3 - 1} = \\frac{242}{2} = 121$."
      en: "Geometric sum: $\\frac{3^5 - 1}{3 - 1} = \\frac{242}{2} = 121$."

  - id: rs-15
    type: numeric
    difficulte: 2
    enonce:
      fr: "Combien vaut $\\dfrac{1}{1\\cdot2} + \\dfrac{1}{2\\cdot3} + \\dots + \\dfrac{1}{9\\cdot10}$ ? Réponds par une fraction irréductible ou un décimal exact."
      en: "What is $\\dfrac{1}{1\\cdot2} + \\dfrac{1}{2\\cdot3} + \\dots + \\dfrac{1}{9\\cdot10}$? Answer with a reduced fraction or an exact decimal."
    reponse: "9/10"
    explication:
      fr: "$\\frac{1}{k(k+1)} = \\frac1k - \\frac1{k+1}$ : la somme se télescope en $1 - \\frac1{10} = \\frac9{10}$."
      en: "$\\frac{1}{k(k+1)} = \\frac1k - \\frac1{k+1}$: the sum telescopes to $1 - \\frac1{10} = \\frac9{10}$."

  - id: rs-16
    type: expression
    difficulte: 3
    enonce:
      fr: "Donne une expression de $\\dfrac{1}{1\\cdot2} + \\dfrac{1}{2\\cdot3} + \\dots + \\dfrac{1}{n(n+1)}$ en fonction de $n$."
      en: "Give an expression for $\\dfrac{1}{1\\cdot2} + \\dfrac{1}{2\\cdot3} + \\dots + \\dfrac{1}{n(n+1)}$ in terms of $n$."
    reponse: "n/(n+1)"
    variables: [n]
    explication:
      fr: "Télescopage : $\\sum_{k=1}^n \\left(\\frac1k - \\frac1{k+1}\\right) = 1 - \\frac1{n+1} = \\frac n{n+1}$."
      en: "Telescoping: $\\sum_{k=1}^n \\left(\\frac1k - \\frac1{k+1}\\right) = 1 - \\frac1{n+1} = \\frac n{n+1}$."

  - id: rs-17
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour tout entier $n \\ge 1$, $2^n \\ge n + 1$."
      en: "For every integer $n \\ge 1$, $2^n \\ge n + 1$."
    reponse: true
    explication:
      fr: "Initialisation : $2 \\ge 2$. Hérédité : $2^{n+1} = 2\\cdot2^n \\ge 2(n+1) \\ge n + 2$ car $n \\ge 0$."
      en: "Base case: $2 \\ge 2$. Inductive step: $2^{n+1} = 2\\cdot2^n \\ge 2(n+1) \\ge n + 2$ since $n \\ge 0$."

  - id: rs-18
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Pour tout entier $n \\ge 1$, $n^2 + n + 41$ est un nombre premier."
      en: "For every integer $n \\ge 1$, $n^2 + n + 41$ is prime."
    reponse: false
    explication:
      fr: "Vrai pour $n = 1, \\dots, 39$, mais pour $n = 40$ on obtient $41^2$. Vérifier beaucoup de cas n'est pas une récurrence."
      en: "True for $n = 1, \\dots, 39$, but $n = 40$ gives $41^2$. Checking many cases is not an induction."

  - id: rs-19
    type: numeric
    difficulte: 2
    enonce:
      fr: "À partir de quel plus petit entier $n_0$ a-t-on $2^n > n^2$ pour tous les entiers $n \\ge n_0$ ?"
      en: "From which smallest integer $n_0$ on does $2^n > n^2$ hold for every integer $n \\ge n_0$?"
    reponse: "5"
    explication:
      fr: "Pour $n = 2, 3, 4$ c'est faux ($4 = 4$, $8 < 9$, $16 = 16$). $2^5 = 32 > 25$. Hérédité pour $n \\ge 5$ : $2^{n+1} = 2\\cdot2^n > 2n^2 \\ge (n+1)^2$ car $n^2 \\ge 2n + 1$ dès $n \\ge 3$."
      en: "It fails for $n = 2, 3, 4$ ($4 = 4$, $8 < 9$, $16 = 16$). $2^5 = 32 > 25$. Inductive step for $n \\ge 5$: $2^{n+1} = 2\\cdot2^n > 2n^2 \\ge (n+1)^2$ since $n^2 \\ge 2n + 1$ for $n \\ge 3$."

  - id: rs-20
    type: numeric
    difficulte: 2
    enonce:
      fr: "La suite est définie par $u_0 = 1$ et $u_{n+1} = 2u_n + 1$. Calcule $u_5$."
      en: "The sequence is defined by $u_0 = 1$ and $u_{n+1} = 2u_n + 1$. Compute $u_5$."
    reponse: "63"
    explication:
      fr: "$u_1 = 3$, $u_2 = 7$, $u_3 = 15$, $u_4 = 31$, $u_5 = 63$. On conjecture $u_n = 2^{n+1} - 1$."
      en: "$u_1 = 3$, $u_2 = 7$, $u_3 = 15$, $u_4 = 31$, $u_5 = 63$. We conjecture $u_n = 2^{n+1} - 1$."

  - id: rs-21
    type: expression
    difficulte: 2
    enonce:
      fr: "La suite est définie par $u_0 = 1$ et $u_{n+1} = 2u_n + 1$. Donne $u_n$ en fonction de $n$."
      en: "The sequence is defined by $u_0 = 1$ and $u_{n+1} = 2u_n + 1$. Give $u_n$ in terms of $n$."
    reponse: "2^(n+1)-1"
    variables: [n]
    explication:
      fr: "Si $u_n = 2^{n+1} - 1$, alors $u_{n+1} = 2(2^{n+1} - 1) + 1 = 2^{n+2} - 1$ : la formule est héréditaire, et vraie pour $n = 0$ ($u_0 = 1$)."
      en: "If $u_n = 2^{n+1} - 1$ then $u_{n+1} = 2(2^{n+1} - 1) + 1 = 2^{n+2} - 1$: the formula is inherited and true for $n = 0$ ($u_0 = 1$)."

  - id: rs-22
    type: vrai-faux
    difficulte: 2
    enonce:
      fr: "Pour tout $n \\ge 1$, $7^n - 1$ est divisible par $6$."
      en: "For every $n \\ge 1$, $7^n - 1$ is divisible by $6$."
    reponse: true
    explication:
      fr: "$7^{n+1} - 1 = 7(7^n - 1) + 6$ : si $6 \\mid 7^n - 1$, alors $6 \\mid 7^{n+1} - 1$. Initialisation : $7 - 1 = 6$."
      en: "$7^{n+1} - 1 = 7(7^n - 1) + 6$: if $6 \\mid 7^n - 1$ then $6 \\mid 7^{n+1} - 1$. Base case: $7 - 1 = 6$."

  - id: rs-23
    type: numeric
    difficulte: 2
    enonce:
      fr: "Pour tout $n \\ge 1$, $n(n+1)(n+2)$ est divisible par un entier fixe maximal $d$. Quel est $d$ ?"
      en: "For every $n \\ge 1$, $n(n+1)(n+2)$ is divisible by a largest fixed integer $d$. What is $d$?"
    reponse: "6"
    explication:
      fr: "Parmi trois entiers consécutifs il y a un multiple de $2$ et un multiple de $3$ : $6$ divise toujours. Pour $n = 1$ le produit vaut $6$, donc aucun entier plus grand ne convient."
      en: "Among three consecutive integers there is a multiple of $2$ and one of $3$: $6$ always divides. For $n = 1$ the product is $6$, so no larger integer works."

  - id: rs-24
    type: numeric
    difficulte: 2
    enonce:
      fr: "Combien de diagonales a un polygone convexe à $12$ côtés ?"
      en: "How many diagonals does a convex polygon with $12$ sides have?"
    reponse: "54"
    explication:
      fr: "On choisit $2$ sommets parmi $12$ ($\\binom{12}{2} = 66$ segments) et on retire les $12$ côtés : $54$. En général $\\frac{n(n-3)}{2}$."
      en: "Choose $2$ vertices among $12$ ($\\binom{12}{2} = 66$ segments) and remove the $12$ sides: $54$. In general $\\frac{n(n-3)}{2}$."

  - id: rs-25
    type: numeric
    difficulte: 2
    enonce:
      fr: "Combien de poignées de main échangent $15$ personnes qui se saluent toutes deux à deux, une seule fois ?"
      en: "How many handshakes occur if $15$ people each shake hands once with every other person?"
    reponse: "105"
    explication:
      fr: "$1 + 2 + \\dots + 14 = \\frac{14\\cdot15}{2} = 105$."
      en: "$1 + 2 + \\dots + 14 = \\frac{14\\cdot15}{2} = 105$."

  - id: rs-26
    type: numeric
    difficulte: 3
    enonce:
      fr: "Combien vaut $\\sum_{k=1}^{10} k\\cdot k!$ ?"
      en: "What is $\\sum_{k=1}^{10} k\\cdot k!$?"
    reponse: "39916799"
    explication:
      fr: "$k\\cdot k! = (k+1)! - k!$ : télescopage, la somme vaut $11! - 1 = 39916799$."
      en: "$k\\cdot k! = (k+1)! - k!$: telescoping, the sum is $11! - 1 = 39916799$."

  - id: rs-27
    type: numeric
    difficulte: 3
    enonce:
      fr: "Combien vaut $\\sum_{k=1}^{n} (2k-1)$ pour $n = 30$ ?"
      en: "What is $\\sum_{k=1}^{n} (2k-1)$ for $n = 30$?"
    reponse: "900"
    explication:
      fr: "Somme des $n$ premiers impairs : $n^2 = 900$."
      en: "Sum of the first $n$ odd numbers: $n^2 = 900$."
