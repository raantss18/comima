id: recurrence-sommes
theme: algèbre
niveau: 2
chapitre: 01-recurrence
titre:
  fr: Sommes et récurrence
  en: Sums and induction
fiche:
  fr: |
    Pour démontrer qu'une propriété $P(n)$ (qui dépend d'un entier $n$) est vraie pour tout entier $n \ge 1$ :

    1. **Initialisation** : on vérifie que $P(1)$ est vraie.
    2. **Hérédité** : on suppose que $P(n)$ est vraie pour un entier $n \ge 1$ fixé et on en déduit que $P(n+1)$ est vraie.

    Les deux étapes sont nécessaires. Ici, $1 + 2 + \dots + n$ désigne la somme des entiers de $1$ à $n$.

    Exemple clé : $1 + 2 + \dots + n = \dfrac{n(n+1)}{2}$.
  en: |
    To prove that a statement $P(n)$ (depending on an integer $n$) holds for every integer $n \ge 1$:

    1. **Base case**: check that $P(1)$ is true.
    2. **Inductive step**: assume that $P(n)$ is true for some fixed integer $n \ge 1$ and deduce that $P(n+1)$ is true.

    Both steps are necessary. Here $1 + 2 + \dots + n$ is the sum of the integers from $1$ to $n$.

    Key example: $1 + 2 + \dots + n = \dfrac{n(n+1)}{2}$.
questions:
  - id: rs-01
    type: numeric
    difficulte: 1
    enonce:
      fr: "Combien vaut $1 + 2 + 3 + \\dots + 10$ ?"
      en: "What is $1 + 2 + 3 + \\dots + 10$?"
    reponse: "55"
    explication:
      fr: "On regroupe $1 + 10$, $2 + 9$, … : cinq paires de somme $11$, donc $55$."
      en: "Pair $1 + 10$, $2 + 9$, …: five pairs adding to $11$, hence $55$."

  - id: rs-02
    type: expression
    difficulte: 2
    enonce:
      fr: "Donne une expression de $S_n = 1 + 2 + \\dots + n$ en fonction de $n$."
      en: "Give an expression for $S_n = 1 + 2 + \\dots + n$ in terms of $n$."
    reponse: "n*(n+1)/2"
    variables: [n]
    explication:
      fr: "En écrivant la somme à l'endroit et à l'envers : $2S_n = n(n+1)$. Toute forme équivalente est acceptée, par exemple $\\frac{n^2+n}{2}$."
      en: "Write the sum forwards and backwards: $2S_n = n(n+1)$. Any equivalent form is accepted, e.g. $\\frac{n^2+n}{2}$."

  - id: rs-03
    type: vrai-faux
    difficulte: 1
    enonce:
      fr: "Pour une récurrence, il suffit de prouver l'hérédité ; l'initialisation est facultative."
      en: "For an induction, proving the inductive step is enough; the base case is optional."
    reponse: false
    explication:
      fr: "Sans initialisation, on peut « prouver » des absurdités : $n = n + 1 \\Rightarrow n + 1 = n + 2$ est héréditaire mais jamais vrai."
      en: "Without a base case one can “prove” nonsense: $n = n + 1 \\Rightarrow n + 1 = n + 2$ is hereditary but never true."

  - id: rs-04
    type: qcm
    difficulte: 2
    enonce:
      fr: "Quelles égalités sont vraies pour tout $n \\ge 1$ ? (plusieurs réponses possibles)"
      en: "Which identities hold for every $n \\ge 1$? (several answers possible)"
    choix:
      - { fr: "$1 + 3 + \\dots + (2n-1) = n^2$", en: "$1 + 3 + \\dots + (2n-1) = n^2$" }
      - { fr: "$1 + 3 + \\dots + (2n-1) = 2n^2 - 1$", en: "$1 + 3 + \\dots + (2n-1) = 2n^2 - 1$" }
      - { fr: "$2 + 4 + \\dots + 2n = n^2$", en: "$2 + 4 + \\dots + 2n = n^2$" }
      - { fr: "$2 + 4 + \\dots + 2n = n(n+1)$", en: "$2 + 4 + \\dots + 2n = n(n+1)$" }
    bonnes: [0, 3]
    explication:
      fr: "Somme des $n$ premiers impairs : $n^2$ ; somme des $n$ premiers pairs : $2 \\cdot \\frac{n(n+1)}{2} = n(n+1)$."
      en: "Sum of the first $n$ odd numbers: $n^2$; of the first $n$ even numbers: $2 \\cdot \\frac{n(n+1)}{2} = n(n+1)$."

  - id: rs-05
    type: ordre
    difficulte: 3
    enonce:
      fr: "Remets dans l'ordre la preuve par récurrence de $P(n) : 1 + 2 + \\dots + n = \\frac{n(n+1)}{2}$, et écarte l'étape fausse."
      en: "Put back in order the proof by induction of $P(n) : 1 + 2 + \\dots + n = \\frac{n(n+1)}{2}$, and discard the wrong step."
    etapes:
      - { fr: "Pour $n = 1$ : $1 = \\frac{1 \\cdot 2}{2}$, donc $P(1)$ est vraie.", en: "For $n = 1$: $1 = \\frac{1 \\cdot 2}{2}$, so $P(1)$ holds." }
      - { fr: "Supposons $1 + \\dots + n = \\frac{n(n+1)}{2}$ pour un $n \\ge 1$ fixé.", en: "Assume $1 + \\dots + n = \\frac{n(n+1)}{2}$ for some fixed $n \\ge 1$." }
      - { fr: "Alors $1 + \\dots + n + (n+1) = \\frac{n(n+1)}{2} + (n+1)$.", en: "Then $1 + \\dots + n + (n+1) = \\frac{n(n+1)}{2} + (n+1)$." }
      - { fr: "Et $\\frac{n(n+1)}{2} + (n+1) = \\frac{(n+1)(n+2)}{2}$ : c'est $P(n+1)$.", en: "And $\\frac{n(n+1)}{2} + (n+1) = \\frac{(n+1)(n+2)}{2}$: this is $P(n+1)$." }
      - { fr: "Par récurrence, $P(n)$ est vraie pour tout $n \\ge 1$.", en: "By induction, $P(n)$ holds for every $n \\ge 1$." }
    dependances: [[1, 2], [2, 3], [0, 4], [3, 4]]
    intrus:
      - { fr: "Supposons $P(n)$ vraie pour tout $n$.", en: "Assume $P(n)$ holds for every $n$." }
    explication:
      fr: "L'initialisation peut être écrite avant ou après l'hérédité ; en revanche, supposer $P(n)$ « pour tout $n$ » revient à supposer ce qu'on veut prouver."
      en: "The base case may come before or after the inductive step; but assuming $P(n)$ “for every $n$” assumes what we want to prove."

  - id: rs-06
    type: trous
    difficulte: 3
    enonce:
      fr: "Complète l'hérédité pour $1 + 3 + \\dots + (2n-1) = n^2$ (somme des $n$ premiers impairs)."
      en: "Complete the inductive step for $1 + 3 + \\dots + (2n-1) = n^2$ (sum of the first $n$ odd numbers)."
    texte:
      fr: "On suppose la somme égale à $n^2$. Le terme suivant est {{1}}, donc la nouvelle somme vaut $n^2 + $ {{1}} $=$ {{2}}."
      en: "Assume the sum equals $n^2$. The next term is {{1}}, so the new sum is $n^2 + $ {{1}} $=$ {{2}}."
    trous:
      - { type: expression, reponse: "2*n+1", variables: [n] }
      - { type: expression, reponse: "(n+1)^2", variables: [n] }
    explication:
      fr: "Le $(n+1)$-ième impair est $2(n+1) - 1 = 2n + 1$ et $n^2 + 2n + 1 = (n+1)^2$."
      en: "The $(n+1)$-th odd number is $2(n+1) - 1 = 2n + 1$ and $n^2 + 2n + 1 = (n+1)^2$."
